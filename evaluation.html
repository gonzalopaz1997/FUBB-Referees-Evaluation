<style>

</style></head><body><div id="h"></div><div id="app"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
const T=Store.get();if(!T)location='index.html';const A=document.getElementById('app'),C=SCORING_CRITERIA;
document.getElementById('h').innerHTML=hdr('Evaluación',hdrInfo(T));
const WP=new Set(allPlays(T).flatMap(p=>[p.referee,...Object.keys(p.rules||{})])),RF=T.referees.some(r=>WP.has(r.name))?T.referees.filter(r=>WP.has(r.name)):T.referees;
let S=RF[0].name;
const lvl=v=>v==null?null:C.levels.find(l=>v>=l.min),lv=s=>(C.levels.find(l=>l.score==s)||{label:''}).label,f=x=>x==null?'–':(Math.round(x*100)/100),P=x=>Math.round(x*100),
sup=C.levels.find(l=>l.score==5).min,abv=C.levels.find(l=>l.score==4).min;
const DL=d=>C.difficulty.labels[d||C.difficulty.default];
const fmtT=t=>String(Math.floor((t||0)/60)).padStart(2,'0')+':'+String((t||0)%60).padStart(2,'0');
const VS=Object.fromEntries(TAG_VALUES.map(v=>[v.key,v.label])),CATN={fouls:'Faltas',violations:'Violaciones',others:'Otros'};
const typeOf=p=>{const inc=p.incident?(p.incident=='other'?'Otro'+(p.iother?': '+p.iother:''):nm(p.incident)):'';const rv=(p.review||[]).map(k=>plain(lbl(k))).join(', ');return [p.cat&&CATN[p.cat],inc,rv].filter(Boolean).join(' / ')||'–'};
const tagsOf=p=>Object.entries(p.tags||{}).map(([k,v])=>({k,v,t:nm(k)+' '+(VS[v]||v)+(k=='other'&&p.otherText?' ('+p.otherText+')':'')}));
const rulesOf=(p,ref)=>{const v=p.rules&&p.rules[ref];return v?(v=='veryBad'?'Muy malo':'Malo'):''};
const gname=g=>`${g.teamA||'Local'} vs ${g.teamB||'Visitante'}`;
const srt=a=>[...a].sort((x,y)=>x.game.n-y.game.n||(y.p.time||0)-(x.p.time||0));
function card(c,hl){const p=c.p,g=c.game,rl=rulesOf(p,S),ok=okCall(p.call);hl=hl||[];
return `<div class="pc"><div class="ph"><b>${esc(g.date||'–')}</b> · ${esc(gname(g))} · <b>${esc(p.q||'')} ${fmtT(p.time)}</b> · ${roleName(p.role)}${p.special?' · Jugada especial':''}${p.crucial?' · Tiempo crucial':''}${g.evaluator?' · Evaluador: '+esc(g.evaluator):''}</div>
<div><span class="cl ${ok?'ok':'ko'}">${esc(callLbl(p.call))}</span>${esc(typeOf(p))}</div>
${tagsOf(p).length?`<div>${tagsOf(p).map(t=>`<span class="tg ${t.v=='neg'||t.v=='supNeg'?'n':'p'} ${hl.includes(t.k)?'hl':''}">${esc(t.t)}</span>`).join('')}</div>`:''}
${rl?`<div class="rl">Error de reglas (${esc(S)}): ${rl}</div>`:''}${p.comment?`<div class="cm">“${esc(p.comment)}”</div>`:''}</div>`}
let CUR=null;
function modal(title,sub,body){const m=document.getElementById('md');m.innerHTML=`<div class="modal md" onclick="closeM()"><div class="w" onclick="event.stopPropagation()"><div class="mh"><div><b>${esc(title)}</b>${sub?`<div class="why">${sub}</div>`:''}</div><button onclick="closeM()" title="Cerrar">${IC.close}</button></div><div class="ml">${body}</div><button onclick="closeM()">Cerrar</button></div></div>`}
const closeM=()=>{document.getElementById('md').innerHTML=''};
function openImp(i){const it=CUR.improvements[i];modal(it.label,`${it.count}x · ${esc(S)} — jugadas detrás de este punto`,srt(it.plays).map(c=>card(c)).join(''))}
function openArea(k){const a=CUR.areas[k],ev=a.evidence,first=a.reason=='autoGames';
const neg=ev.negPlays.length?`<div class="sec">Marcas negativas (${ev.negPlays.length} jugadas) · límite ${C.negativeMarks.maxPerGame} por juego</div>`+srt(ev.negPlays).map(c=>card(c,c.tags)).join(''):'';
const aut=ev.autoGames.length?`<div class="sec">Juegos con causa automática en esta área (${ev.autoGames.length})</div>`+ev.autoGames.map(x=>`<div class="why" style="margin-top:.6vh"><b>${esc(x.cause.label)}</b> → ${x.cause.score} · ${esc(gname(x.game))}</div>`+srt(x.cause.plays.map(p=>({game:x.game,p}))).map(c=>card(c)).join('')).join(''):'';
modal(`${a.label} · ${a.score} (${lv(a.score)})`,esc(why(a,CUR.games)),(first?aut+neg:neg+aut)||'<div class="why">No hay jugadas específicas registradas.</div>')}
function openOverall(){const r=CUR,gs=r.byGame.filter(g=>g.causes.length),low=Object.values(r.areas).filter(a=>a.score!=null&&a.score<3);
modal(`Global · ${r.overall} (${r.overallLabel})`,esc(r.overallInfo.reasons.join(' ')||''),(low.length?`<div class="sec">Áreas por debajo del estándar</div>`+low.map(a=>`<div class="why">${esc(a.label)}: ${a.score}</div>`).join(''):'')+(gs.length?`<div class="sec">Juegos con causa automática</div>`+gs.map(g=>g.causes.map(c=>`<div class="why" style="margin-top:.6vh"><b>${esc(c.label)}</b> → ${c.score} · ${esc(gname(g.game))}</div>`+srt((c.plays||[]).map(p=>({game:g.game,p}))).map(x=>card(x)).join('')).join('')).join(''):''))}
function openGame(i){const g=T.games[i];if(!g)return;const ar=assessReferee({games:[g]},S),bg=ar.byGame[0]||{causes:[],scores:{}},gi={id:g.id,n:g.n,date:g.date,teamA:g.teamA,teamB:g.teamB,evaluator:g.evaluator};
const mine=g.plays.filter(p=>p.referee==S||(p.rules&&p.rules[S])).map(p=>({game:gi,p}));
const areas=Object.entries(ar.areas).map(([k,a])=>`<div>${esc(a.label)}<div class="why">${esc(why(a,1))}</div></div><span class="pill s${a.score||0}">${a.score??'–'}</span>`).join('');
const causes=bg.causes.length?`<div class="sec">Causa automática</div>`+bg.causes.map(c=>`<div class="warn">${IC.warn} <span>${esc(c.label)} → ${c.score}</span></div>`).join(''):'';
modal(`${gname(g)} · Global ${ar.overall??'–'}${ar.overall?' ('+ar.overallLabel+')':''}`,`${esc(S)} · ${esc(g.date||'–')} · Dificultad ${DL(g.difficulty)}${g.evaluator?' · Evaluador: '+esc(g.evaluator):''} · Terna: ${(g.refs||[]).filter(Boolean).map(esc).join(' / ')}`,
`<button class="cta gbtn" onclick="dlGame(${i})">${IC.dl2} Informe del partido</button>${ar.overallInfo.reasons.map(x=>`<div class="warn">${IC.warn} ${x}</div>`).join('')}${causes}<div class="sec">Puntaje por área en este juego</div><div class="ga">${areas}</div><div class="sec">Jugadas de ${esc(S)} en este juego (${mine.length})</div>${srt(mine).map(c=>card(c)).join('')||'<div class="why">Sin jugadas.</div>'}`)}
function dlGame(i){const g=T.games[i];if(!g)return;const TT={games:[g]};const names=[...new Set([...(g.refs||[]).filter(Boolean),...g.plays.map(p=>p.referee),...g.plays.flatMap(p=>Object.keys(p.rules||{}))])].filter(n=>g.plays.some(p=>p.referee==n||(p.rules&&p.rules[n])));
const rows=g.plays.map(p=>`<tr><td class="c">${p.n}</td><td class="c">${esc(p.q||'')} ${fmtT(p.time)}</td><td>${esc(callLbl(p.call))}</td><td>${esc(p.referee||'')}</td><td>${roleName(p.role)}</td><td>${esc(typeOf(p))}${Object.keys(p.rules||{}).length?'<br><b>Error de reglas:</b> '+Object.entries(p.rules).map(([n,v])=>esc(n)+' ('+(v=='veryBad'?'Muy malo':'Malo')+')').join(', '):''}</td><td>${tagsOf(p).map(t=>esc(t.t)).join(', ')||'–'}</td><td class="c">${p.special?'★':''}${p.crucial?' TC':''}</td><td>${esc(p.comment||'')}</td></tr>`).join('');
const css=REPORT_CSS,d=new Date(),pd=n=>String(n).padStart(2,'0');
const html=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Informe del partido ${esc(gname(g))}</title><style>${css}</style></head><body><header><h1>Informe del partido · FUBB 5x5</h1><p>${esc(gname(g))} · ${esc(g.date||'')} · ${esc(g.tournament||T.name||'')} · Dificultad ${DL(g.difficulty)} · Evaluador: ${esc(g.evaluator||T.evaluator||'–')} · Terna: ${(g.refs||[]).filter(Boolean).map(esc).join(' / ')} · generado el ${pd(d.getDate())}/${pd(d.getMonth()+1)}/${d.getFullYear()} · versión ${APP_VERSION}</p></header>
<section><h2>Jugadas registradas <small>${g.plays.length}</small></h2><table><tr><th>#</th><th>Tiempo</th><th>Resultado</th><th>Árbitro</th><th>Posición</th><th>Incidente</th><th>Tags</th><th>★ / TC</th><th>Comentario</th></tr>${rows}</table><p class="n">★ = jugada especial · TC = tiempo crucial.</p></section>${names.map(n=>section(n,TT)).join('')}${rules()}</body></html>`;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`Informe del partido ${g.date||''} ${gname(g)}.html`.replace(/[\\/:*?"<>|]/g,'-');a.click()}
function dlImp(){const r=CUR,L=[];const d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${p(d.getDate())}${p(d.getMonth()+1)}${d.getFullYear()}`;
L.push('ÁREAS DE MEJORA','Competencia: '+(T.consolidated?'Consolidado':(T.name||'–')),'Árbitro: '+S,'Generado: '+`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`+' · Versión de la app '+APP_VERSION,'');
if(!r.improvements.length)L.push('No se identificaron.');
r.improvements.forEach(it=>{L.push('='.repeat(60),`${it.label} — ${it.count}x${it.mostRepeated?' (más repetida)':''}`,'='.repeat(60));
srt(it.plays).forEach((c,n)=>{const q=c.p,g=c.game,tg=tagsOf(q).map(t=>t.t).join(', '),rl=rulesOf(q,S);
L.push(`${n+1}. ${g.date||'–'} | ${gname(g)} | ${q.q||''} ${fmtT(q.time)} | ${roleName(q.role)}${q.special?' | Jugada especial':''}${q.crucial?' | Tiempo crucial':''}${g.evaluator?' | Evaluador: '+g.evaluator:''}`,
`   Resultado del cobro: ${callLbl(q.call)} | Tipo/incidente: ${typeOf(q)}`,`   Tags: ${tg||'–'}`,`   Error de reglas: ${rl||'–'}`);if(q.comment)L.push(`   Comentario: ${q.comment}`)});L.push('')});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/plain'}));a.download=`Áreas de mejora ${S} ${stamp}.txt`.replace(/[\\/:*?"<>|]/g,'-');a.click()}
function why(a,n){if(a.defaulted)return `Sin puntos registrados → puntaje por defecto ${a.score} (${lv(a.score)})`;
const base=`Prom. ${f(a.raw)} pts · ${f(a.negPerGame)} marcas negativas / juego`;
if(a.reason=='negMarks')return `${base} · más de ${C.negativeMarks.maxPerGame} por juego → ${a.score}`;
if(a.reason=='autoGames')return `${base} · por debajo del estándar automático en ${a.ownedAuto}/${n} juegos (más del ${P(C.autoGameShare)}%) → ${a.score}`;
if(a.score>=4)return `${base} · ${a.score==5?a.superiorGames:a.aboveGames}/${n} juegos en ${a.score==5?sup:abv}+ (sostenido) → ${lv(a.score)}`;
return `${base} · ${lv(a.score)}`}
function prog(){return [...T.games].filter(g=>g.plays.some(p=>p.referee==S||(p.rules&&p.rules[S]))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.n-b.n).map(g=>{const ar=assessReferee({games:[g]},S),o=ar.overall,cs=ar.byGame[0]?ar.byGame[0].causes:[];return `<tr><td style="white-space:nowrap">${esc(g.date||'–')}</td><td>${esc(gname(g))}${T.consolidated&&g.evaluator?`<br><span class="dim">${esc(g.evaluator)}</span>`:''}</td><td>${DL(g.difficulty)}</td><td><button class="pill gp s${o||0}" onclick="openGame(${T.games.indexOf(g)})" title="Ver las jugadas de este juego">${o??'–'}</button></td></tr>${cs.length?`<tr><td colspan="4" style="padding:0 0 .8vh"><div class="warn">${IC.warn} <span>${cs.map(c=>esc(c.label)).join(' · ')}</span></div></td></tr>`:''}`}).join('')||'<tr><td colspan="4">Todavía no hay juegos.</td></tr>'}
function R(){const r=assessReferee(T,S),ref=T.referees.find(x=>x.name==S);CUR=r;
A.innerHTML=`<div class="m"><div><div class="card"><div class="sel"><select class="inp" onchange="S=this.value;R()">${RF.map(x=>`<option ${S==x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)} (${esc(x.cat)})</option>`).join('')}</select><button onclick="dl([S])">${IC.dl2} Informe</button><button onclick="dl(RF.map(x=>x.name))">${IC.dl2} Todos</button></div>
<div class="ov ${r.overall!=null&&r.overall<3?'click':''}" style="margin-top:1vh;${r.overall!=null&&r.overall<3?'cursor:pointer':''}" ${r.overall!=null&&r.overall<3?'onclick="openOverall()"':''}><div class="big5 s${r.overall||0}">${r.overall??'–'}</div><div><div style="font-weight:800;font-size:1.2em">Global: ${r.overallLabel||'Sin datos'}${r.overall!=null&&r.overall<3?'<span class="see">ver jugadas</span>':''}</div><div class="sub">${esc(S)} · Categoría ${esc(ref.cat)} · ${r.games} juego(s)</div>${r.overallInfo.reasons.map(x=>`<div class="warn" style="margin-top:.4vh">${IC.warn} ${x}</div>`).join('')}</div></div></div>
<div class="card grow"><h3>PUNTAJES</h3><div class="scr">${Object.entries(r.areas).map(([k,a])=>{const low=a.score!=null&&a.score<3;return `<div class="ar ${low?'click':''}" ${low?`onclick="openArea('${k}')"`:''}><div>${a.label}${low?'<span class="see">ver jugadas</span>':''}</div><div class="pill s${a.score||0}">${a.score??'–'}</div><div class="bar"><i style="width:${(a.raw||0)*20}%"></i></div>
<div class="dim">${why(a,r.games)}</div></div>`}).join('')}</div></div></div>
<div><div class="card grow"><h3>Evolución por juego</h3><div class="dim" style="margin-bottom:.4vh">Tocá el puntaje para ver las jugadas y descargar el informe del partido</div><div class="scr"><table><tr><th>Fecha</th><th>Juego</th><th>Dificultad</th><th>Global</th></tr>${prog()}</table></div></div></div>
<div><div class="card grow"><div class="hh"><h3>Áreas de mejora</h3><button onclick="dlImp()" title="Descargar las jugadas de estas áreas (.txt)" ${r.improvements.length?'':'disabled style="opacity:.4"'}>${IC.dl} .txt</button></div><div class="dim" style="margin-bottom:.4vh">Tocá un ítem para ver las jugadas</div><div class="scr">${r.improvements.map((i,n)=>`<button class="imp" onclick="openImp(${n})"><span>${esc(i.label)}${i.mostRepeated?'<span class="tag">Más repetida</span>':''}</span><b>${i.count}x</b></button>`).join('')||'Sin datos'}</div></div></div></div><div id="md"></div>`}
function section(name,TT){TT=TT||T;const r=assessReferee(TT,name),ref=T.referees.find(x=>x.name==name)||{cat:'–'},pl=allPlays(TT).filter(p=>p.referee==name),ar=Object.entries(r.areas);
const nR=['L','C','T'].map(k=>pl.filter(p=>p.role==k).length).join(' / ');
const gameRes=g=>{const og=TT.games.find(x=>x.id==g.id);const o=og?assessReferee({games:[og]},name).overall:null;return o};
const cellS=(g,k)=>{const v=g.scores[k],m=g.marks[k],own=g.causes.some(c=>c.area==k);if(v==null)return `<td class="c">–<br><small>neg: ${m}</small></td>`;return `<td class="c ${own?'bad':''}">${f(v)}${g.defaults&&g.defaults[k]?' <small>por defecto</small>':''}<br><small>neg: ${m}${own?' · auto':''}</small></td>`};
const calc=r.byGame.map(g=>{const go=gameRes(g);return `<tr><td>${g.n}</td><td>${esc(g.date||'–')}</td><td>${esc(g.teams)}${g.evaluator?`<br><small>${esc(g.evaluator)}</small>`:''}</td><td class="c">${g.plays}</td><td class="c">${DL(g.difficulty)}</td>${C.areas.map(a=>cellS(g,a.key)).join('')}<td class="c ${g.causes.length?'bad':''}">${g.causes.length?g.causes.map(c=>esc(c.label)+` → ${c.score}`).join('<br>'):'–'}</td><td class="c"><b>${go??'–'}</b></td></tr>`}).join('');
const nC=C.areas.length;
const sum=`<tr class="sm"><td colspan="5">Promedio de los juegos (puntos, ajustados por dificultad)</td>${C.areas.map(a=>`<td class="c">${f(r.areas[a.key].raw)}</td>`).join('')}<td colspan="2"></td></tr>
<tr class="sm"><td colspan="5">Marcas negativas por juego (límite ${C.negativeMarks.maxPerGame})</td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c ${x.reason=='negMarks'?'bad':''}">${f(x.negPerGame)}</td>`}).join('')}<td colspan="2"></td></tr>
<tr class="sm"><td colspan="5">Juegos con causa automática del área (límite ${P(C.autoGameShare)}% de los juegos)</td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c ${x.reason=='autoGames'?'bad':''}">${x.ownedAuto}/${r.games}</td>`}).join('')}<td colspan="2"></td></tr>
<tr class="sm"><td colspan="5">Juegos en ${abv}+ / ${sup}+ (el mérito necesita ${P(C.sustainedShare)}% de los juegos)</td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c">${x.aboveGames} / ${x.superiorGames}</td>`}).join('')}<td colspan="2"></td></tr>
<tr class="sm"><td colspan="5"><b>Puntaje final del área</b></td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c ${x.forcedBelow?'bad':''}"><b>${x.score??'–'}</b>${x.forcedBelow?'<br><small>forzado</small>':''}${x.defaulted?'<br><small>por defecto</small>':''}</td>`}).join('')}<td colspan="2"></td></tr>`;
const sc=ar.map(([,x])=>x.score).filter(v=>v!=null),avg=r.overallInfo.avgAreas;
const reasonTxt=x=>x.defaulted?'Sin puntos registrados → por defecto':x.reason=='negMarks'?`Más de ${C.negativeMarks.maxPerGame} marcas negativas por juego`:x.reason=='autoGames'?'Por debajo del estándar automático en más del '+P(C.autoGameShare)+'% de los juegos':x.reason=='merit'?'Rendimiento positivo sostenido':'Estándar (ninguna regla lo sube ni lo baja)';
return `<section><h2>${esc(name)} <small>Categoría ${esc(ref.cat)}</small></h2>
<div class="kp"><div><b>${r.overall??'–'}</b>Global<br>${r.overallLabel||''}</div><div><b>${r.games}</b>Juegos</div><div><b>${pl.length}</b>Jugadas</div><div><b>${nR}</b>Jugadas Líder / Central / Seguidor</div></div>
<h3>1. Puntajes por área</h3><table><tr><th>Área</th><th>Prom. puntos</th><th>Marcas negativas / juego</th><th>Juegos automáticos</th><th>Puntaje</th><th>Por qué</th></tr>${ar.map(([,x])=>`<tr><td>${x.label}</td><td>${f(x.raw)}</td><td>${f(x.negPerGame)}</td><td>${x.ownedAuto}/${r.games}</td><td><b>${x.score??'–'}</b> ${lv(x.score)}</td><td>${reasonTxt(x)}</td></tr>`).join('')}
<tr class="sm"><td colspan="4"><b>Rendimiento global, consistencia y criterio</b><br><small>Promedio de los puntajes por área: ${f(avg)} → ${avg==null?'–':lvl(avg).score}${r.overallInfo.reasons.length?'<br>'+r.overallInfo.reasons.join('<br>'):''}</small></td><td><b>${r.overall??'–'}</b> ${r.overallLabel||''}</td><td>Juegos automáticos: ${r.overallInfo.autoGames}/${r.games}${r.overallInfo.naGames?` (No aceptables: ${r.overallInfo.naGames})`:''}</td></tr></table>
<h3>2. Tabla de cálculo: juego por juego</h3><p class="n">Cada celda: el promedio de puntos del juego en el área (ya ajustado por la dificultad del juego: ${Object.entries(C.difficulty.adjust).map(([k,v])=>`${C.difficulty.labels[k]} ${v>0?'+':''}${v}`).join(', ')}) y, debajo, la cantidad de marcas negativas en ese juego. “auto” indica un puntaje del área forzado por una causa automática. Las últimas columnas muestran la(s) causa(s) automática(s) y el puntaje resultante del juego.</p>
<table class="calc"><tr><th>#</th><th>Fecha</th><th>Juego</th><th>Jugadas</th><th>Dificultad</th>${C.areas.map(a=>`<th>${a.label}</th>`).join('')}<th>Causa automática</th><th>Puntaje del juego</th></tr>${calc||`<tr><td colspan="${nC+7}">Sin juegos.</td></tr>`}${sum}</table>
<h3>3. Áreas de mejora</h3>${r.improvements.length?`<table><tr><th>Categoría / tag</th><th>Veces</th></tr>${r.improvements.map(i=>`<tr><td>${esc(i.label)}${i.mostRepeated?' <b>(más repetida)</b>':''}</td><td>${i.count}x</td></tr>`).join('')}</table>`:'<p>No se identificaron.</p>'}
</section>`}
function rules(){const L=C.levels;return `<section class="rules"><h2>Reglas de puntaje aplicadas</h2><ul>
<li><b>El estándar es el punto de partida.</b> Cada área empieza en 3 (${lv(3)}). Baja a ${C.belowStandardScore} solo si el árbitro promedia más de ${C.negativeMarks.maxPerGame} marcas negativas (tags − o −−) por juego en esa área, o si más del ${P(C.autoGameShare)}% de los juegos tiene una causa automática de esa área.</li>
<li>Sube a 4 o 5 solo con mérito sostenido: el promedio del área llega a ${abv} (4, ${lv(4)}) o ${sup} (5, ${lv(5)}) y al menos el ${P(C.sustainedShare)}% de los juegos del árbitro alcanzan ese nivel por sí solos, sin causa automática en el área.</li>
<li>La dificultad del juego (se elige al cerrarlo) suma ${Object.entries(C.difficulty.adjust).filter(([,v])=>v).map(([k,v])=>`${v>0?'+':''}${v} (${C.difficulty.labels[k]})`).join(' / ')} puntos al promedio del juego en todas las áreas; no cambia las marcas negativas ni las causas automáticas.</li>
<li>Puntos: muy negativo ${C.tagPoints.supNeg}, negativo ${C.tagPoints.neg}, positivo ${C.tagPoints.pos}, muy positivo ${C.tagPoints.supPos}. Selección de cobros: cobro correcto ${C.callPoints.correct.default}, cobro incorrecto ${C.callPoints.incorrect.default} (${C.callPoints.incorrect.supNeg} si es muy negativo). Jugadas especiales ×${C.importantPlayFactor.correct} si el cobro es correcto, ×${C.importantPlayFactor.incorrect} si es incorrecto (máximo ${C.maxPoint}; un cobro correcto nunca supera ${C.correctCallMax}).</li>
<li>Área sin puntos: ${C.noData&&C.noData.score!=null?`recibe ${C.noData.score} (${lv(C.noData.score)}) por defecto`:'queda sin evaluar'}.</li>
<li>Global = nivel del promedio de los cinco puntajes por área (${L.slice(0,3).map(l=>`${l.score} desde ${l.min}`).join('; ')}). No puede superar ${C.overallCapIfAnyBelow} si un área está en ${C.belowStandardScore} o si algún juego tiene causa automática. Más del ${P(C.autoGameShare)}% de juegos con causa automática → global ${C.belowStandardScore}; más del ${P(C.notAcceptableGameShare)}% de juegos No aceptables → global ${C.notAcceptableScore}.</li>
<li><b>Resultados automáticos por juego:</b><ul>${C.autoCauses.map(c=>`<li>${c.score} (${C.scoreLabels[c.score]}): ${c.label}. <small>Criterio FIBA: ${c.fiba}</small></li>`).join('')}</ul></li></ul></section>`}
const REPORT_CSS=`body{font:13px/1.45 -apple-system,Segoe UI,Arial,sans-serif;color:#1b1b1b;margin:0;padding:24px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:22px}h1+p{margin:0 0 18px;color:#666}header{border-bottom:4px solid #a39665;padding-bottom:10px;margin-bottom:18px}section{page-break-after:always;margin-bottom:28px}section:last-child{page-break-after:auto}h2{font-size:18px;border-left:6px solid #a39665;padding-left:10px}h2 small{color:#777;font-weight:400;font-size:13px;margin-left:8px}h3{font-size:14px;color:#7a6e45;margin:18px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:8px}th,td{border:1px solid #d6d2c4;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f1eee2}td.c,th{text-align:center}.calc th{font-size:11px}.sm td{background:#f8f6ee}.bad{background:#f6d9d5!important;color:#8a2c25}small{color:#777}.n{color:#666;margin:2px 0 6px}.kp{display:flex;gap:10px;margin:10px 0}.kp div{flex:1;border:1px solid #d6d2c4;border-radius:6px;padding:8px;text-align:center;background:#faf9f4}.kp b{display:block;font-size:20px}.rules li{margin:3px 0}@media print{body{padding:0}}`;
function dl(names){const css=REPORT_CSS;
const d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${p(d.getDate())}${p(d.getMonth()+1)}${d.getFullYear()}`;
const who=T.consolidated?`Consolidado de ${T.games.length} juegos`:`${esc(T.name||'')} · ${esc(gname(T.games[0]||{}))} · ${esc((T.games[0]||{}).date||'')} · Evaluador: ${esc(T.evaluator||'–')}`;

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`Evaluación 5x5 ${names.length==1?names[0]+' ':''}${stamp}.html`.replace(/[\\/:*?"<>|]/g,'-');a.click()}
R();</script></body></html>
