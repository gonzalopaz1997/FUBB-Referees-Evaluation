.pos{display:grid;grid-template-columns:5.5em 1fr 3.6em;gap:.8vh .6vw;align-items:center;font-size:.88em}.pos>*{cursor:pointer}.pos .bar{display:flex;height:1.5em;border-radius:5px;overflow:hidden;background:#202020}.pos .bar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.75em;font-weight:700;color:#111}
.court{width:100%;height:24vh;--cw:100%}.z{cursor:default}.z.has{cursor:pointer}.z.g1{background:rgba(127,174,122,.5)}.z.y1{background:rgba(214,184,80,.5)}.z.r1{background:rgba(201,104,95,.6)}.z span{font-size:.7em;color:#eee;font-weight:700}

.lg{display:flex;gap:.8vw;flex-wrap:wrap;font-size:.72em;color:#9a978c;margin-top:.5vh}.lg i{display:inline-block;width:.9em;height:.9em;border-radius:2px;margin-right:.3em;vertical-align:-.1em}
.btn{display:flex;align-items:center;justify-content:center;gap:.5vw;padding:1vh;font-weight:700}.btn.cta{background:var(--o);color:#111;border-color:var(--o)}
.im{display:flex;flex-direction:column;overflow:auto;min-height:0}.im button{display:flex;justify-content:space-between;gap:.5vw;background:none;border:0;border-bottom:1px solid #2a2a2a;border-radius:0;padding:.6vh 0;text-align:left;font-size:.84em}.im .tag{background:var(--o);color:#111;border-radius:6px;padding:0 .4em;font-size:.75em;font-weight:700;margin-left:.4em}
.tabs{display:flex;gap:.4vw;margin-bottom:.6vh}.tabs button{flex:1;padding:.5vh;font-size:.82em}
.ev{display:flex;flex-direction:column;overflow:auto;min-height:0}.ev button{display:grid;grid-template-columns:1fr auto;gap:.5vw;align-items:center;background:none;border:0;border-bottom:1px solid #2a2a2a;border-radius:0;padding:.6vh 0;text-align:left;font-size:.82em}.ev .p{min-width:3.1em;padding:.15em .4em;border-radius:1em;text-align:center;font-weight:800}
.modal>div.w{max-width:860px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:1vh}.xr{display:flex;justify-content:space-between;align-items:flex-start;gap:1vw;color:var(--o)}.xr button{padding:4px;display:flex}.ml{overflow:auto;display:flex;flex-direction:column;gap:.8vh;min-height:0}

.pc{border:1px solid var(--b);border-radius:8px;padding:.7vh .7vw;background:#181818;font-size:.88em;display:flex;flex-direction:column;gap:.3vh}.pc .ph{color:#b9b3a0;font-size:.9em}.pc .cl{display:inline-block;border-radius:5px;padding:0 .4em;font-weight:800;font-size:.85em}.pc .cl.g{background:rgba(127,174,122,.35);color:#e8f2e6}.pc .cl.r{background:rgba(201,104,95,.4);color:#f6e2df}
.pc .tg{display:inline-block;border:1px solid var(--b);border-radius:5px;padding:0 .4em;font-size:.82em;margin:.2vh .3vw 0 0}.pc .tg.n{border-color:var(--r);color:#f0c2bc}.pc .tg.p{border-color:var(--g);color:#cfe3cc}.pc .why{color:#e2cb78;font-size:.85em}
.sec{color:var(--o2);font-weight:700;margin-top:.6vh}
.cmp{flex:1;display:flex;flex-direction:column;min-height:0}.cmp .ls{overflow:auto;min-height:0;display:flex;flex-direction:column}

.ab .p{min-width:3.1em;padding:.2em .4em;border-radius:1em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ad{display:flex;flex-wrap:wrap;gap:.3vh .3vw;margin-top:.35vh}.ch{font-size:.72em;border-radius:5px;padding:.1em .45em;background:#232323;border:1px solid #333;color:#cfcab8;white-space:nowrap}.ch b{font-variant-numeric:tabular-nums}.ch.u{border-color:rgba(127,174,122,.6);color:#cfe3cc}.ch.d{border-color:rgba(201,104,95,.7);color:#f0c2bc}.ch.e{border-color:#555;color:#d8d3c0}.ch.a{border-style:dashed;color:#e2cb78;border-color:#6b6040}.ch.x{border-color:var(--r);background:#2a1715;color:#f0c2bc}.ch.n0{color:#8a877b;background:none;border-style:dashed}
.gf{margin-top:.6vh;border-top:1px solid var(--b);padding-top:.6vh;font-size:.8em;color:#cfcab8;line-height:1.35}.gf b{color:var(--tx)}
.sr{display:flex;flex-direction:column;overflow:auto;min-height:0}.sr button{display:grid;grid-template-columns:auto 1fr auto;gap:.6vw;align-items:center;background:none;border:0;border-bottom:1px solid #2a2a2a;border-radius:0;padding:.6vh 0;text-align:left;font-size:.82em}.sr .pt{min-width:2.9em;text-align:center;border-radius:1em;padding:.1em .35em;font-weight:800;font-size:.9em}.sr .pt.u{background:rgba(127,174,122,.35);color:#e8f2e6}.sr .pt.d{background:rgba(201,104,95,.45);color:#fbe6e3}.sr small{display:block;color:#8a877b;font-size:.85em}.sr b.c{color:var(--o2)}
</style></head><body><div id="app"></div><div id="md"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script src="referee-pool.js"></script><script>
const T=Store.get();if(!T)location='index.html';
const C=SCORING_CRITERIA,CONS=!!T.consolidated,F2=scoreFmt,QS=PERIODS.map(p=>p[0]),RL=['L','C','T'];
const DL=d=>C.difficulty.labels[d||C.difficulty.default];
const WP=new Set(T.games.flatMap(g=>g.plays.flatMap(p=>[...playRefs(p).map(r=>r.name),...(p.reviews||[]).flatMap(r=>r.refs||[]),...Object.keys(p.rules||{})])));
const RF=T.referees.filter(r=>WP.has(r.name)).length?T.referees.filter(r=>WP.has(r.name)):T.referees;
let S=RF.length?RF[0].name:'',F={cat:'all',type:'all',role:'all'},tab=CONS?'ev':'dn';
const lvc=v=>'s'+((levelOfScore(v)||{score:3}).score);
const gname=g=>`${g.teamA||'Local'} vs ${g.teamB||'Visitante'}`;
const fmtT=t=>String(Math.floor((t||0)/60)).padStart(2,'0')+':'+String((t||0)%60).padStart(2,'0');
const typeOf=p=>{const a=[];if(p.incident)a.push((({fouls:'Falta',violations:'Violación',others:'Otros'})[p.cat]||'')+': '+(p.incident=='other'?(p.iother||'Otro'):nm(p.incident)));return a.join('')||'–'};
const VAL={supNeg:'−−',neg:'−',pos:'+',supPos:'++'};
/* jugadas del árbitro seleccionado (con su posición en esa jugada) */
const mineOf=name=>T.games.flatMap(g=>g.plays.filter(p=>playInvolves(p,name)).map(p=>({g,p,role:playRole(p,name)})));
const KO=a=>a.filter(x=>!okCall(x.p.call)).length,OK=a=>a.length-KO(a);
const zc=a=>{if(!a.length)return'';const r=OK(a)/a.length;return r>=.8?'g1':r>=.6?'y1':'r1'};
let store=[];const reg=a=>{store.push(a);return store.length-1};const q=s=>JSON.stringify(s).replace(/"/g,'&quot;');
function card(x){const p=x.p,g=x.g||x.game;return `<div class="pc"><div class="ph"><b>${esc(p.q||'')} ${fmtT(p.time)}</b> · ${esc(refsTxt(p))}${CONS&&g?' · '+esc(gname(g))+' '+esc(g.date||''):''}${p.special?' · ★ Jugada especial':''}${p.crucial?' · Tiempo crucial':''}</div>
<div>${p.call?`<span class="cl ${okCall(p.call)?'g':'r'}">${esc(callLbl(p.call))}</span> `:''}${esc(typeOf(p))}</div>
${(p.reviews||[]).map(r=>`<div class="dim">${esc(reviewText(r))} · fueron: ${r.refs.map(esc).join(', ')}</div>`).join('')}
${Object.keys(p.rules||{}).length?`<div class="why">Error de reglas: ${Object.entries(p.rules).map(([n,v])=>esc(n)+' ('+(v=='veryBad'?'Muy malo':'Malo')+')').join(', ')}</div>`:''}
${Object.keys(p.tags||{}).length?`<div>${Object.entries(p.tags).map(([k,v])=>`<span class="tg ${v=='neg'||v=='supNeg'?'n':'p'}">${esc(nm(k))} ${VAL[v]||''}</span>`).join('')}</div>`:''}
${x.why?`<div class="why">${esc(x.why)}</div>`:''}${p.comment?`<div class="dim"><i>“${esc(p.comment)}”</i></div>`:''}</div>`}
function modal(title,sub,body){document.getElementById('md').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="w"><div class="xr"><div><b>${title}</b>${sub?`<div class="dim">${sub}</div>`:''}</div><button onclick="closeM()" title="Cerrar">${IC.close}</button></div><div class="ml">${body}</div><button onclick="closeM()">Cerrar</button></div></div>`}
function closeM(){document.getElementById('md').innerHTML=''}
const showPlays=(title,arr)=>modal(esc(title),`${arr.length} jugada(s)`,arr.map(card).join('')||'<div class="dim">Sin jugadas.</div>');
function areaModal(k){const r=assessReferee(T,S),a=r.areas[k];let body='';
if(!CONS){const x=r.byGame[0].areas[k];body=`<div class="calc">${x.defaulted?`<span>Sin puntos en el partido</span><b>${F2(C.noDataScore)}</b>`:`<span>Promedio de ${x.n} punto(s)</span><b>${F2(x.raw)}</b><span>Dificultad ${DL(r.byGame[0].difficulty)}</span><b>${x.adj>0?'+':''}${F2(x.adj)}</b>`}${x.capped?`<span>Limitado por causa automática</span><b>máx. ${F2(Math.min(...x.capped.map(c=>C.causeCap[c.score])))}</b>`:''}<span class="tt"><b style="text-align:left">Puntaje del área</b></span><b class="tt">${F2(x.score)}</b></div>`}
else body=`<div class="calc"><span>Promedio de ${r.games} partido(s)</span><b>${F2(a.score)}</b></div>`;
if(a.causes.length)body+=`<div class="sec">Causas automáticas</div>`+a.causes.map(c=>`<div class="why">${IC.warn} ${esc(c.cause.label)}${CONS?' · '+esc(gname(c.game)):''}</div>`).join('');
body+=`<div class="sec">Puntos por debajo de 3 (${a.low.length})</div>`+(a.low.map(l=>card({p:l.p,g:l.game,why:l.why})).join('')||'<div class="dim">Ninguno.</div>');
modal(esc(a.label)+' · '+F2(a.score),esc(S)+' · '+esc(a.levelLabel),body)}
function causeModal(){const r=assessReferee(T,S);modal('Por qué el puntaje es '+F2(r.overall),esc(S),r.reasons.map(x=>`<div class="why">${IC.warn} ${esc(x)}</div>`).join('')+r.causes.map(c=>`<div class="sec">${esc(c.cause.label)} → máx. ${F2(C.causeCap[c.cause.score])}${CONS?' · '+esc(gname(c.game)):''}</div>`+c.cause.plays.map(p=>card({p,g:c.game})).join('')).join('')||'<div class="dim">Sin causas.</div>')}
function gameModal(i){const g=T.games[i],r=assessReferee({games:[g]},S),x=r.byGame[0];if(!x)return;
modal(`${esc(gname(g))} · ${F2(r.overall)} (${esc(r.overallLabel)})`,`${esc(S)} · ${esc(g.date||'')} · Dificultad ${DL(g.difficulty)}${g.evaluator?' · Evaluador: '+esc(g.evaluator):''}`,
`<button class="btn cta" onclick="dlGame(${i})">${IC.dl2} Informe del partido</button>${r.reasons.map(t=>`<div class="why">${IC.warn} ${esc(t)}</div>`).join('')}${x.causes.map(c=>`<div class="why">${IC.warn} ${esc(c.label)}</div>`).join('')}<div class="calc">${Object.values(x.areas).map(a=>`<span>${esc(a.label)}</span><b>${F2(a.score)}</b>`).join('')}</div><div class="sec">Jugadas de ${esc(S)} (${x.plays.length})</div>${x.plays.map(p=>card({p,g})).join('')}`)}
function impModal(i){const it=assessReferee(T,S).improvements[i];modal(esc(it.label),`${it.count} vez/veces · ${esc(S)}`,it.plays.map(x=>card({p:x.p,g:x.game})).join(''))}
/* Composición del puntaje: de dónde salió cada número (agrupa los puntos iguales: "2× COBRO CORRECTO 4,00") */
function itemsOf(r){const o={};r.byGame.forEach(x=>Object.values(x.areas).forEach(a=>a.items.forEach(it=>(o[a.key]=o[a.key]||[]).push({...it,g:x.game}))));return o}
function grp(items){const m=new Map();items.forEach(it=>{const k=it.what+'|'+it.pts+'|'+(it.p.special?1:0);if(!m.has(k))m.set(k,{what:it.what+(it.p.special?' ★':''),pts:it.pts,list:[]});m.get(k).list.push(it)});return [...m.values()].sort((a,b)=>b.pts-a.pts||b.list.length-a.list.length)}
const cls=x=>x>C.standard?'u':x<C.standard?'d':'e';
const sg=x=>(x>0?'+':'')+F2(x);
function compHTML(r){const its=itemsOf(r),single=!CONS&&r.byGame.length==1,x=single?r.byGame[0]:null;
 const rows=Object.values(r.areas).map(a=>{const y=single?x.areas[a.key]:null,gs=grp(its[a.key]||[]);
  let det='';if(single&&y.defaulted)det=`<span class="ch n0">Sin registros → cuenta como ${F2(C.noDataScore)} (estándar)</span>`;
  else{det=gs.map(g=>`<span class="ch ${cls(g.pts)}" onclick="event.stopPropagation();showPlays(${q(g.what)},store[${reg(g.list.map(it=>({p:it.p,g:it.g})))}])">${g.list.length}× ${esc(g.what)} <b>${F2(g.pts)}</b></span>`).join('');
   if(single){det+=`<span class="ch e">Promedio <b>${F2(y.raw)}</b></span>`;if(y.adj)det+=`<span class="ch a">Dificultad ${esc(DL(x.difficulty))} <b>${sg(y.adj)}</b></span>`;if(y.capped)det+=`<span class="ch x">Tope por causa automática <b>máx. ${F2(Math.min(...y.capped.map(c=>C.causeCap[c.score])))}</b></span>`}
   else{const nd=r.byGame.filter(z=>z.areas[a.key].defaulted).length;det+=`<span class="ch e">Promedio de ${r.games} partido(s)${nd?` · ${nd} sin registros (3,00)`:''}</span>`}}
  return `<button class="ab" onclick="areaModal('${a.key}')"><div class="ah"><span>${esc(a.label)}</span><span class="p ${lvc(a.score)}">${F2(a.score)}</span></div><div class="ad">${det}</div></button>`}).join('');
 const vals=Object.values(r.areas).map(a=>a.score);
 const gf=single?`<b>Global</b> = (${vals.map(F2).join(' + ')}) ÷ ${vals.length} = <b>${F2(x.avgAreas)}</b>${x.global<x.avgAreas?`<br><span style="color:#f0c2bc">${x.reasons.map(esc).join(' ')} → <b>${F2(x.global)}</b></span>`:''}`
  :`<b>Global</b> = promedio del global de ${r.games} partido(s) = <b>${F2(r.overall)}</b>`;
 return `<div class="ls">${rows}</div><div class="gf">${gf}<br><span class="dim">Cada decisión correcta vale ${F2(C.callPoints.correct)} y cada incorrecta ${F2(C.callPoints.incorrect)}; los tags suben o bajan su área. Un área sin registros cuenta como ${F2(C.noDataScore)}. Tocá un área o un ítem para ver las jugadas.</span></div>`}
/* Lo que sumó (más de 3) y lo que restó (menos de 3) */
function srHTML(r,up){const all=Object.values(itemsOf(r)).flat().filter(it=>up?it.pts>C.standard:it.pts<C.standard),gs=grp(all).sort((a,b)=>up?b.pts-a.pts||b.list.length-a.list.length:a.pts-b.pts||b.list.length-a.list.length);
 const area=it=>{for(const a of C.areas)if(r.byGame.some(z=>z.areas[a.key].items.some(i=>i.p===it.p&&i.what===it.what)))return a.short||a.label;return ''};
 return gs.map(g=>`<button onclick="showPlays(${q(g.what)},store[${reg(g.list.map(it=>({p:it.p,g:it.g})))}])"><span class="pt ${up?'u':'d'}">${F2(g.pts)}</span><span>${esc(g.what)}<small>${esc(area(g.list[0]))}</small></span><b class="c">${g.list.length}×</b></button>`).join('')||`<span class="dim">${up?'Nada por encima de 3.':'Nada por debajo de 3.'}</span>`}
function R(){store=[];const r=assessReferee(T,S),ref=T.referees.find(x=>x.name==S)||{cat:'–'},all=mineOf(S),ko=KO(all);
const f=all.filter(x=>(F.cat=='all'||x.p.cat==F.cat)&&(F.type=='all'||x.p.incident==F.type)),fr=f.filter(x=>F.role=='all'||x.role==F.role);
const types=[...new Set(all.filter(x=>(F.cat=='all'||x.p.cat==F.cat)&&x.p.incident).map(x=>x.p.incident))];
const maxQ=Math.max(1,...QS.map(qq=>fr.filter(x=>x.p.q==qq).length)),h=v=>`${v/maxQ*13.5}vh`;
const bars=QS.map(qq=>{const a=fr.filter(x=>x.p.q==qq),o=OK(a),k=KO(a);return `<button class="col" ${a.length?`onclick="showPlays(${q(qq+(F.role!='all'?' · '+roleName(F.role):''))},store[${reg(a)}])"`:''}><div class="stk">${o?`<i class="ok" style="height:${h(o)}">${o}</i>`:''}${k?`<i class="ko" style="height:${h(k)}">${k}</i>`:''}</div><small>${qq}</small></button>`}).join('');
let worst=null;const mxr=Math.max(1,...RL.flatMap(rr=>QS.map(qq=>KO(f.filter(x=>x.role==rr&&x.p.q==qq)))));
const mx=RL.map(rr=>`<tr><th class="rh">${roleName(rr)}</th>${QS.map(qq=>{const a=f.filter(x=>x.role==rr&&x.p.q==qq),k=KO(a);if(a.length&&k&&(!worst||k>worst.k||(k==worst.k&&a.length<worst.n)))worst={k,n:a.length,rr,qq};return a.length?`<td style="background:${k?`rgba(201,104,95,${.18+.7*k/mxr})`:'rgba(127,174,122,.28)'}" onclick="showPlays(${q(roleName(rr)+' · '+qq)},store[${reg(a)}])">${k}<span class="dim">/${a.length}</span></td>`:'<td class="r0">–</td>'}).join('')}<td class="tot">${KO(f.filter(x=>x.role==rr))}<span class="dim">/${f.filter(x=>x.role==rr).length}</span></td></tr>`).join('');
const byT=[...new Set(fr.filter(x=>x.p.incident).map(x=>x.p.incident))].map(k=>({k,a:fr.filter(x=>x.p.incident==k)})).sort((x,y)=>KO(y.a)-KO(x.a)||y.a.length-x.a.length);const mt=Math.max(1,...byT.map(t=>t.a.length));
const tps=byT.map(t=>{const i=reg(t.a),oc=`onclick="showPlays(${q(lbl(t.k))},store[${i}])"`;return `<span ${oc}>${esc(lbl(t.k))}</span><div class="bar" ${oc}><i class="ok" style="width:${OK(t.a)/mt*100}%"></i><i class="ko" style="width:${KO(t.a)/mt*100}%"></i></div><span class="v" ${oc}>${KO(t.a)} de ${t.a.length}</span>`}).join('')||'<span class="dim">Sin jugadas con este filtro.</span>';
const mp=Math.max(1,...RL.map(rr=>f.filter(x=>x.role==rr).length));
const pos=RL.map(rr=>{const a=f.filter(x=>x.role==rr),i=reg(a),oc=a.length?`onclick="showPlays(${q(roleName(rr))},store[${i}])"`:'';return `<span ${oc}>${roleName(rr)}</span><div class="bar" ${oc}>${OK(a)?`<i class="ok" style="width:${OK(a)/mp*100}%">${OK(a)}</i>`:''}${KO(a)?`<i class="ko" style="width:${KO(a)/mp*100}%">${KO(a)}</i>`:''}</div><span class="v" ${oc}>${KO(a)} de ${a.length}</span>`}).join('');
const court=Array.from({length:16},(_,i)=>{const a=fr.filter(x=>x.p.zone==i+1);return `<button class="z ${zc(a)} ${a.length?'has':''}" aria-label="Zona ${i+1}" ${a.length?`onclick="showPlays(${q('Zona '+(i+1))},store[${reg(a)}])"`:'tabindex=-1'}>${a.length?`<span>${KO(a)}/${a.length}</span>`:''}</button>`}).join('');const bz=fr.filter(x=>x.p.zone==17);
const bad=r.overall!=null&&r.overall<C.areaBelow,hasCause=r.causes.length>0;
const causeBox=(bad||hasCause)?`<div class="cause">${r.causes.slice(0,3).map(c=>`<div>${IC.warn}<span><b>${esc(C.scoreLabels[c.cause.score])}:</b> ${esc(c.cause.label)}${CONS?` · ${esc(gname(c.game))}`:''}</span></div>`).join('')}${r.causes.length>3?`<div>y ${r.causes.length-3} causa(s) más</div>`:''}${!hasCause?`<div>${IC.warn}<span>El promedio de las áreas quedó debajo de ${F2(C.areaBelow)}. Revisá las áreas en rojo.</span></div>`:''}<u onclick="causeModal()">ver jugadas</u></div>`:'';
const capNote=!CONS&&r.reasons.length?`<div class="capn">${r.reasons.map(esc).join(' ')}</div>`:'';
const gm=T.games.map((g,i)=>({g,i,x:assessReferee({games:[g]},S)})).filter(o=>o.x.games).sort((a,b)=>(a.g.date||'').localeCompare(b.g.date||''));
const G0=T.games[0]||{};
const impl=r.improvements.map((it,i)=>`<button onclick="impModal(${i})"><span>${esc(it.label)}${it.mostRepeated?'<span class="tag">Más repetida</span>':''}</span><b>${it.count}x</b></button>`).join('')||'<span class="dim">No hay puntos por debajo de 3.</span>';
const evl=gm.map(o=>`<button onclick="gameModal(${o.i})"><span>${esc(o.g.date||'–')} · ${esc(gname(o.g))}<br><span class="dim">${esc(o.g.evaluator||'')} · ${DL(o.g.difficulty)}</span></span><span class="p ${lvc(o.x.overall)}">${F2(o.x.overall)}</span></button>`).join('');
document.getElementById('app').innerHTML=`<div class="app">${hdr(CONS?'Evaluación (consolidado)':'Evaluación del partido',hdrInfo(T))}<main class="m">
<div><section class="c"><select class="sel" onchange="S=this.value;F={cat:'all',type:'all',role:'all'};R()">${RF.map(x=>`<option ${S==x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)} (${esc(x.cat)})</option>`).join('')}</select>
<div class="top"><button class="big ${lvc(r.overall)}" onclick="causeModal()" title="Ver detalle">${F2(r.overall)}</button><b class="n">${esc(S)}</b><span class="dim">Categoría ${esc(ref.cat)} · ${CONS?`${r.games} partido(s)${r.causeGames?` · ${r.causeGames} con causa automática`:''}`:`${esc(gname(G0))} · ${esc(G0.date||'')} · ${DL(G0.difficulty)}`}</span><span class="lvl">${esc(r.overallLabel)}</span>${causeBox}${capNote}</div>
<div class="sum"><button onclick="showPlays('Todas las jugadas',store[${reg(all)}])"><b>${all.length}</b>jugadas</button><button class="o" onclick="showPlays('Correctas',store[${reg(all.filter(x=>okCall(x.p.call)))}])"><b>${all.length-ko}</b>correctas</button><button class="k" onclick="showPlays('Incorrectas',store[${reg(all.filter(x=>!okCall(x.p.call)))}])"><b>${ko}</b>incorrectas</button></div></section>
<section class="c cmp"><h3>Cómo se llega al ${F2(r.overall)} <small>puntaje por área</small></h3>${compHTML(r)}</section>
<button class="btn cta" onclick="${CONS?'dlRef()':'dlGame(0)'}">${IC.dl2} ${CONS?'Informe de '+esc(S.split(' ')[0]):'Informe del partido'}</button></div>
<div><section class="c"><div class="fl"><span class="lb">Ver:</span>${[['all','Todas'],['fouls','Faltas'],['violations','Violaciones'],['others','Otros']].map(([k,l])=>`<button class="${F.cat==k?'on':''}" onclick="F.cat='${k}';F.type='all';R()">${l}</button>`).join('')}<select onchange="F.type=this.value;R()"><option value="all">Todos los tipos</option>${types.map(t=>`<option value="${t}" ${F.type==t?'selected':''}>${esc(lbl(t))}</option>`).join('')}</select></div></section>
<section class="c"><h3>Decisiones por cuarto <small><i style="display:inline-block;width:.8em;height:.8em;background:var(--g);border-radius:2px"></i> correctas &nbsp;<i style="display:inline-block;width:.8em;height:.8em;background:var(--r);border-radius:2px"></i> incorrectas</small></h3><div class="fl" style="margin-bottom:.6vh"><span class="lb">Posición:</span>${[['all','Todas'],...RL.map(x=>[x,roleName(x)])].map(([k,l])=>`<button class="${F.role==k?'on':''}" onclick="F.role='${k}';R()">${l}</button>`).join('')}</div><div class="bars">${bars}</div></section>
<section class="c"><h3>Incorrectas por posición y cuarto <small>incorrectas / jugadas</small></h3><table class="mx"><tr><th></th>${QS.map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr>${mx}</table>${worst?`<div class="ins">${IC.warn} Más errores: <b>${roleName(worst.rr)} en ${worst.qq}</b> (${worst.k} de ${worst.n}).</div>`:''}</section>
<section class="c" style="flex:1;display:flex;flex-direction:column"><h3>Por tipo de incidente <small>ordenado por incorrectas</small></h3><div class="tp">${tps}</div></section></div>
<div><section class="c"><h3>Por posición</h3><div class="pos">${pos}</div></section>
<section class="c"><h3>Por zona de cancha <small>incorrectas / jugadas</small></h3><div class="court">${COURT}${court}</div><button class="bcz ${zc(bz)}" ${bz.length?`onclick="showPlays('Campo trasero',store[${reg(bz)}])"`:''}>Campo trasero${bz.length?` · ${KO(bz)}/${bz.length}`:''}</button><div class="lg"><span><i style="background:rgba(127,174,122,.6)"></i>Mayoría correctas</span><span><i style="background:rgba(214,184,80,.6)"></i>Mezcla</span><span><i style="background:rgba(201,104,95,.65)"></i>Mayoría incorrectas</span></div></section>
<section class="c" style="flex:1;display:flex;flex-direction:column;min-height:0"><div class="tabs">${CONS?`<button class="${tab=='ev'?'on':''}" onclick="tab='ev';R()">Por partido</button>`:''}<button class="${tab=='dn'?'on':''}" onclick="tab='dn';R()">${IC.down} Restó</button><button class="${tab=='up'?'on':''}" onclick="tab='up';R()">${IC.up} Sumó</button></div>${tab=='ev'?`<div class="ev">${evl}</div>`:`<div class="sr">${srHTML(r,tab=='up')}</div>`}</section></div>
</main></div>`}

/* ---------- Informes (HTML para descargar) ---------- */
const REPORT_CSS=`body{font:13px/1.45 -apple-system,Segoe UI,Arial,sans-serif;color:#1b1b1b;margin:0;padding:24px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:22px}header p{margin:0 0 18px;color:#666}header{border-bottom:4px solid #a39665;padding-bottom:10px;margin-bottom:18px}section{margin-bottom:28px;page-break-inside:avoid}h2{font-size:18px;border-left:6px solid #a39665;padding-left:10px}h2 small{color:#777;font-weight:400;font-size:13px;margin-left:8px}h3{font-size:14px;color:#7a6e45;margin:16px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:8px}th,td{border:1px solid #d6d2c4;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f1eee2}td.c{text-align:center}.bad{background:#f6d9d5;color:#8a2c25}small{color:#777}.kp{display:flex;gap:10px;margin:10px 0}.kp div{flex:1;border:1px solid #d6d2c4;border-radius:6px;padding:8px;text-align:center;background:#faf9f4}.kp b{display:block;font-size:22px}`;
function playsTable(g){return `<table><tr><th>#</th><th>Tiempo</th><th>Resultado</th><th>Árbitros (posición)</th><th>Incidente / revisión</th><th>Tags</th><th>★ / TC</th><th>Comentario</th></tr>${g.plays.map(p=>`<tr><td class="c">${p.n}</td><td class="c">${esc(p.q||'')} ${fmtT(p.time)}</td><td>${esc(callLbl(p.call))}</td><td>${esc(refsTxt(p))}</td><td>${esc(typeOf(p))}${(p.reviews||[]).map(r=>`<br>${esc(reviewText(r))} (fueron: ${r.refs.map(esc).join(', ')})`).join('')}${Object.keys(p.rules||{}).length?'<br><b>Error de reglas:</b> '+Object.entries(p.rules).map(([n,v])=>esc(n)+' ('+(v=='veryBad'?'Muy malo':'Malo')+')').join(', '):''}</td><td>${Object.entries(p.tags||{}).map(([k,v])=>esc(nm(k))+' '+(VAL[v]||'')).join(', ')||'–'}</td><td class="c">${p.special?'★':''}${p.crucial?' TC':''}</td><td>${esc(p.comment||'')}</td></tr>`).join('')}</table><p><small>★ = jugada especial · TC = tiempo crucial.</small></p>`}
function refSection(name,TT){const r=assessReferee(TT,name),ref=T.referees.find(x=>x.name==name)||{cat:'–'},single=r.games==1,x=single?r.byGame[0]:null;
return `<section><h2>${esc(name)} <small>Categoría ${esc(ref.cat)}${single?'':` · ${r.games} partidos`}</small></h2><div class="kp"><div><b>${F2(r.overall)}</b>${esc(r.overallLabel)}</div><div><b>${x?x.calls.ok:r.byGame.reduce((s,y)=>s+y.calls.ok,0)}</b>Cobros correctos</div><div><b>${x?x.calls.bad:r.byGame.reduce((s,y)=>s+y.calls.bad,0)}</b>Cobros incorrectos</div></div>
${r.causes.length?`<h3>Causas automáticas</h3><ul>${r.causes.map(c=>`<li class="bad">${esc(c.cause.label)} → máx. ${F2(C.causeCap[c.cause.score])}${single?'':' · '+esc(gname(c.game))}</li>`).join('')}</ul>`:''}${r.reasons.length?`<p>${r.reasons.map(esc).join(' ')}</p>`:''}
<h3>Puntajes por área</h3><table><tr><th>Área</th>${single?'<th>Puntos</th><th>Promedio</th><th>Dificultad</th><th>Tope</th>':'<th>Partidos</th>'}<th>Puntaje</th><th>Nivel</th></tr>${Object.values(r.areas).map(a=>{const y=single?x.areas[a.key]:null;return `<tr${a.score<C.areaBelow?' class="bad"':''}><td>${esc(a.label)}</td>${single?`<td class="c">${y.n}</td><td class="c">${y.defaulted?'sin puntos':F2(y.raw)}</td><td class="c">${y.defaulted?'–':(y.adj>0?'+':'')+F2(y.adj)}</td><td class="c">${y.capped?'máx. '+F2(Math.min(...y.capped.map(c=>C.causeCap[c.score]))):'–'}</td>`:`<td class="c">${r.games}</td>`}<td class="c"><b>${F2(a.score)}</b></td><td>${esc(a.levelLabel)}</td></tr>`}).join('')}<tr><td><b>Global</b> <small>promedio de las áreas${single?' con topes':' de los partidos'}</small></td>${single?'<td></td><td></td><td></td><td></td>':'<td></td>'}<td class="c"><b>${F2(r.overall)}</b></td><td>${esc(r.overallLabel)}</td></tr></table>
${single?'':`<h3>Por partido</h3><table><tr><th>Fecha</th><th>Partido</th><th>Evaluador</th><th>Dificultad</th><th>Global</th></tr>${r.byGame.map(y=>`<tr><td>${esc(y.game.date||'')}</td><td>${esc(gname(y.game))}</td><td>${esc(y.game.evaluator||'')}</td><td>${DL(y.difficulty)}</td><td class="c">${F2(y.global)}</td></tr>`).join('')}</table>`}
<h3>Áreas de mejora</h3>${r.improvements.length?`<table><tr><th>Ítem</th><th>Veces</th></tr>${r.improvements.map(i=>`<tr><td>${esc(i.label)}${i.mostRepeated?' <b>(más repetida)</b>':''}</td><td class="c">${i.count}</td></tr>`).join('')}</table>`:'<p>No hay puntos por debajo de 3.</p>'}</section>`}
function save(html,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name.replace(/[\\/:*?"<>|]/g,'-');a.click()}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};
function dlGame(i){const g=T.games[i];if(!g)return;const TT={games:[g]};const names=[...(g.refs||[]).filter(Boolean)].filter(n=>assessReferee(TT,n).games);

function dlRef(){save(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Informe ${esc(S)}</title><style>${REPORT_CSS}</style></head><body><header>${isDemo()?DEMO_NOTE:''}<h1>Informe consolidado · FUBB 5x5</h1><p>${esc(S)} · generado el ${stamp()} · versión ${APP_VERSION}</p></header>${refSection(S,T)}</body></html>`,`Informe consolidado ${S}.html`)}
R();</script></body></html>
