<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5fc4"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Evaluación del torneo</title>
<style>
body{font-size:clamp(13px,2.1vh,24px)}
.m{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1vw;padding:1vh 1vw 2.5vh;max-width:1400px;margin:auto}.m>div{display:flex;flex-direction:column;gap:1vh;min-width:0}.m .card{margin:0}
.sel{display:flex;gap:.8vw;align-items:center;flex-wrap:wrap}.sel select{flex:1;min-width:12em;font-size:1.05em;padding:1vh}.sel button{display:flex;align-items:center;gap:.4vw;white-space:nowrap;padding:1vh 1vw}.sub{color:var(--o2);font-size:.85em}
.ov{display:flex;align-items:center;gap:1.5vw}.big5{width:3.4em;height:3.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2em;font-weight:800;color:var(--ink);flex:none}
.s5{background:var(--o2);color:var(--ink)}.s4{background:var(--o);color:var(--ink)}.s3{background:#a9bcd6;color:var(--ink)}.s2{background:var(--r);color:#fff}.s0{background:var(--c2);color:var(--tx)}
.ar{display:grid;grid-template-columns:1fr 2.2em;gap:.3vh 1vw;align-items:center;padding:.9vh 0;border-bottom:1px solid var(--b)}.ar .bar{grid-column:1;height:.7vh;background:var(--c2);border-radius:4px;overflow:hidden}.ar .bar i{display:block;height:100%;background:var(--o)}
.pill{grid-row:1/3;grid-column:2;width:2em;height:2em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink)}.warn{color:var(--y);font-size:.78em;grid-column:1;display:flex;gap:.4em;align-items:center}.dim{color:var(--mu);font-size:.8em}
.imp{display:flex;justify-content:space-between;gap:1vw;padding:.8vh 0;border-bottom:1px solid var(--b)}.imp b{color:var(--o2)}.tag{background:var(--o);color:var(--ink);border-radius:6px;padding:0 .5em;font-size:.75em;font-weight:700;margin-left:.5em}
</style></head><body><div id="h"></div><div id="app"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
const T=Store.get();if(!T)location='index.html';const A=document.getElementById('app'),C=SCORING_CRITERIA;
document.getElementById('h').innerHTML=hdr('Evaluación del torneo',esc(T.name)+'<br>'+esc(T.date||''));
const WP=new Set(allPlays(T).map(p=>p.referee)),RF=T.referees.some(r=>WP.has(r.name))?T.referees.filter(r=>WP.has(r.name)):T.referees;
let S=RF[0].name;
const lvl=v=>v==null?null:C.levels.find(l=>v>=l.min),lv=s=>(C.levels.find(l=>l.score==s)||{label:''}).label,f=x=>x==null?'–':(Math.round(x*100)/100);
function prog(){return [...T.games].filter(g=>g.plays.some(p=>p.referee==S)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.n-b.n).map(g=>{const a=g.plays.filter(p=>p.referee==S),o=assessReferee({games:[g]},S).overall;return `<tr><td>${esc(g.date||'–')}</td><td>J${g.day||'–'}</td><td>${esc(g.teamA||'?')} vs ${esc(g.teamB||'?')}</td><td>${!g.closed&&!g.difficulty?'<span class="dim">En curso</span>':difficultyOf(g.difficulty).label+(g.difficulty?'':' <span class="dim">(sin elegir)</span>')}</td><td>${nKo(a)} de ${a.length}</td><td><span class="pill s${o||0}" style="width:1.8em;height:1.8em;display:inline-flex">${o??'–'}</span></td></tr>`}).join('')||'<tr><td colspan="6">Todavía no hay juegos.</td></tr>'}
function R(){const r=assessReferee(T,S),ref=T.referees.find(x=>x.name==S);
A.innerHTML=`<div class="m"><div><div class="card"><div class="sel"><select class="inp" onchange="S=this.value;R()">${RF.map(x=>`<option ${S==x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)} (${x.cat})</option>`).join('')}</select><button onclick="dl([S])">${IC.dl2} Informe (este árbitro)</button><button onclick="dl(RF.map(x=>x.name))">${IC.dl2} Informe (todos)</button></div>
<div class="ov" style="margin-top:1vh"><div class="big5 s${r.overall||0}">${r.overall??'–'}</div><div><div style="font-weight:800;font-size:1.3em">Global: ${r.overallLabel||'Sin datos'}</div><div class="sub">${esc(S)} · Categoría ${ref.cat} · ${r.games} juego(s) evaluado(s)</div></div></div></div>
<div class="card"><h3>PUNTAJES</h3>${Object.values(r.areas).map(a=>`<div class="ar"><div>${a.label}</div><div class="pill s${a.score||0}">${a.score??'–'}</div><div class="bar"><i style="width:${(a.raw||0)*20}%"></i></div>
<div class="dim">${a.defaulted?`Sin puntos registrados → puntaje por defecto ${a.score} (${lv(a.score)})`:`Promedio ${f(a.raw)} · ${a.gamesBelow}/${r.games} juegos por debajo del estándar · ${lv(a.score)}`}</div>${a.forcedBelow?`<div class="warn">${IC.warn} Más del ${C.belowStandardGameShare*100}% de los juegos por debajo del estándar → puntaje 2</div>`:''}</div>`).join('')}</div></div>
<div><div class="card"><h3>Áreas de mejora</h3>${r.improvements.map(i=>`<div class="imp"><span>${esc(i.label)}${i.mostRepeated?'<span class="tag">Más repetida</span>':''}</span><b>${i.count}x</b></div>`).join('')||'Sin datos'}</div>
<div class="card"><h3>Evolución por juego</h3><table><tr><th>Fecha</th><th>Jornada</th><th>Juego</th><th>Dificultad</th><th>Incorrectas</th><th>Global</th></tr>${prog()}</table></div></div></div>`}
function section(name){const r=assessReferee(T,name),ref=T.referees.find(x=>x.name==name),pl=allPlays(T).filter(p=>p.referee==name),ar=Object.entries(r.areas);
const RP=['L','C','T'].map(k=>nKo(pl.filter(p=>p.role==k))).join(' / ');
const cellS=(v,d)=>{if(v==null)return '<td class="c">–</td>';const l=lvl(v);return `<td class="c ${l.score<=C.belowStandardScore?'bad':''}">${f(v)}<br><small>${l.score}${d?' · por defecto':''}</small></td>`};
const calc=r.byGame.map(g=>`<tr><td>${g.n}</td><td>${esc(g.date||'–')} (J${g.day||'–'})</td><td>${esc(g.teams)}</td><td class="c">${g.difficulty.label}<br><small>${g.difficulty.adjust>0?'+':''}${g.difficulty.adjust||'±0'}</small></td><td class="c">${g.plays}</td>${C.areas.map(a=>cellS(g.scores[a.key],g.defaults&&g.defaults[a.key])).join('')}</tr>`).join('');
const sum=`<tr class="sm"><td colspan="5">Promedio de los puntajes por juego</td>${C.areas.map(a=>`<td class="c">${f(r.areas[a.key].raw)}</td>`).join('')}</tr>
<tr class="sm"><td colspan="5">Juegos por debajo del estándar / total de juegos (base de la regla)</td>${C.areas.map(a=>`<td class="c">${r.areas[a.key].gamesBelow}/${r.games}</td>`).join('')}</tr>
<tr class="sm"><td colspan="5">Nivel según el promedio</td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c">${x.raw==null?'–':lvl(x.raw).score}</td>`}).join('')}</tr>
<tr class="sm"><td colspan="5"><b>Puntaje final del área</b> (regla del ${C.belowStandardGameShare*100}% aplicada)</td>${C.areas.map(a=>{const x=r.areas[a.key];return `<td class="c ${x.forcedBelow?'bad':''}"><b>${x.score??'–'}</b>${x.forcedBelow?'<br><small>forzado</small>':''}${x.defaulted?'<br><small>por defecto</small>':''}</td>`}).join('')}</tr>`;
const sc=ar.map(([,x])=>x.score).filter(v=>v!=null),avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null,lowAny=sc.some(v=>v<=C.belowStandardScore);
const rawOv=avg==null?null:lvl(avg).score;
return `<section><h2>${esc(name)} <small>Categoría ${ref.cat}</small></h2>
<div class="kp"><div><b>${r.overall??'–'}</b>Global<br>${r.overallLabel||''}</div><div><b>${r.games}</b>Juegos</div><div><b>${pl.length}</b>Jugadas</div><div><b>${nKo(pl)}</b>Incorrectas</div><div><b>${RP}</b>Incorrectas Líder / Central / Seguidor</div></div>
<h3>1. Puntajes por área</h3><table><tr><th>Área</th><th>Promedio</th><th>Juegos por debajo del estándar (del total)</th><th>Puntaje</th><th>Nivel</th></tr>${ar.map(([,x])=>`<tr><td>${x.label}</td><td>${f(x.raw)}</td><td>${x.gamesBelow}/${r.games}</td><td><b>${x.score??'–'}</b></td><td>${lv(x.score)}${x.forcedBelow?' (forzado por regla)':''}${x.defaulted?' (por defecto: sin puntos registrados)':''}</td></tr>`).join('')}
<tr class="sm"><td colspan="3"><b>Rendimiento global, consistencia y criterio</b><br><small>Promedio de los puntajes por área: ${f(avg)} → nivel ${rawOv??'–'}${lowAny&&rawOv>C.overallCapIfAnyBelow?`; limitado a ${C.overallCapIfAnyBelow} porque un área está en ${C.belowStandardScore}`:''}</small></td><td><b>${r.overall??'–'}</b></td><td>${r.overallLabel||''}</td></tr></table>
<h3>2. Tabla de cálculo: puntaje por juego y área</h3><p class="n">Cada celda muestra el promedio de puntos del área en ese juego y, debajo, el nivel que le corresponde (1–5). Las celdas resaltadas están por debajo del estándar. El puntaje de cada juego ya incluye el ajuste por dificultad.</p>
<table class="calc"><tr><th>#</th><th>Fecha</th><th>Juego</th><th>Dificultad</th><th>Jugadas</th>${C.areas.map(a=>`<th>${a.label}</th>`).join('')}</tr>${calc||'<tr><td colspan="10">Sin juegos.</td></tr>'}${sum}</table>
<h3>3. Áreas de mejora</h3>${r.improvements.length?`<table><tr><th>Categoría / tag</th><th>Veces</th></tr>${r.improvements.map(i=>`<tr><td>${esc(i.label)}${i.mostRepeated?' <b>(más repetida)</b>':''}</td><td>${i.count}x</td></tr>`).join('')}</table>`:'<p>No se identificaron.</p>'}
</section>`}
function rules(){const L=C.levels;return `<section class="rules"><h2>Reglas de puntaje aplicadas</h2><ul>
<li>Umbrales de nivel: ${L.slice(0,3).map(l=>`${l.score} (${l.label}) desde ${l.min}`).join('; ')}; si no, ${C.belowStandardScore} (Por debajo del estándar).</li>
<li>Las jugadas registradas son una selección del evaluador, por eso el informe muestra cantidades de cobros incorrectos y no porcentajes de acierto.</li>
<li>Puntaje del área = promedio de los puntajes por juego. Si más del ${C.belowStandardGameShare*100}% de los juegos de un árbitro están por debajo del estándar en un área, esa área queda en ${C.belowStandardScore}.</li>
<li>Selección de cobros: solo faltas y violaciones. Cobro correcto ${C.callPoints.correct.default} pts (${C.callPoints.correct.supPos} con tag Cobro cruzado/DW, CIP o Llamada fantasma muy positivo); cobro incorrecto ${C.callPoints.incorrect.default} pts (${C.callPoints.incorrect.supNeg} si es muy negativo). Un juego queda en ${C.belowStandardScore} con ${C.gameAutoBelow.incorrectCipMin} o más cobros CIP incorrectos o más de ${C.gameAutoBelow.incorrectCallsMoreThan} cobros incorrectos.</li>
<li>Otras áreas: puntos por tag — muy negativo ${C.tagPoints.supNeg}, negativo ${C.tagPoints.neg}, positivo ${C.tagPoints.pos}, muy positivo ${C.tagPoints.supPos}; el puntaje del área es su promedio.</li>
<li>Dificultad del juego: el puntaje de cada área en el juego se ajusta según la dificultad elegida al cerrarlo (${C.difficulty.options.map(o=>`${o.label} ${o.adjust>0?'+':''}${o.adjust}`).join(', ')}), con mínimo ${C.difficulty.minPoint} y máximo ${C.maxPoint}. Un juego sin dificultad elegida cuenta como ${difficultyOf().label}.</li>
<li>Jugadas especiales: puntos ×${C.importantPlayFactor.correct} si el cobro es correcto, ×${C.importantPlayFactor.incorrect} si es incorrecto (máximo ${C.maxPoint}).</li>
${C.noData&&C.noData.score!=null?`<li>Área sin puntos: recibe ${C.noData.score} (${lv(C.noData.score)}) por defecto${C.noData.scope==='game'?', juego por juego':' cuando el árbitro no tiene puntos en ella en ningún juego'}.</li>`:''}<li>Global = nivel del promedio de los cinco puntajes por área; no puede superar ${C.overallCapIfAnyBelow} si algún área está en ${C.belowStandardScore}.</li></ul></section>`}
function dl(names){const css=`body{font:13px/1.45 -apple-system,Segoe UI,Arial,sans-serif;color:#1b1b1b;margin:0;padding:24px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:22px}h1+p{margin:0 0 18px;color:#666}header{border-bottom:4px solid #0b5fc4;padding-bottom:10px;margin-bottom:18px}section{page-break-after:always;margin-bottom:28px}section:last-child{page-break-after:auto}h2{font-size:18px;border-left:6px solid #0b5fc4;padding-left:10px}h2 small{color:#777;font-weight:400;font-size:13px;margin-left:8px}h3{font-size:14px;color:#0b5fc4;margin:18px 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:8px}th,td{border:1px solid #c9d8ea;padding:5px 7px;text-align:left;vertical-align:top}th{background:#e6f0fb}td.c,th{text-align:center}.calc th{font-size:11px}.sm td{background:#f3f8fe}.bad{background:#f6d9d5!important;color:#8a2c25}small{color:#777}.n{color:#666;margin:2px 0 6px}.kp{display:flex;gap:10px;margin:10px 0}.kp div{flex:1;border:1px solid #c9d8ea;border-radius:6px;padding:8px;text-align:center;background:#f6faff}.kp b{display:block;font-size:20px}.rules li{margin:3px 0}@media print{body{padding:0}}`;
const d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${p(d.getDate())}${p(d.getMonth()+1)}${d.getFullYear()}`;
const html=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(T.name)} – Evaluación del torneo</title><style>${css}</style></head><body><header><h1>Evaluación del torneo</h1><p>${esc(T.name)} · ${esc(T.date||'')} · generado el ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}</p></header>${names.map(section).join('')}${rules()}</body></html>`;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`${T.name} Evaluación ${names.length==1?names[0]+' ':''}${stamp}.html`.replace(/[\\/:*?"<>|]/g,'-');a.click()}
R();</script></body></html>
