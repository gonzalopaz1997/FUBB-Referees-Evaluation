<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a39665"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Reglas de puntaje</title>
<style>
body{font-size:16px;line-height:1.5}.sr{max-width:1000px;margin:auto;padding:12px 14px 40px}
.sr h2{color:var(--o);font-size:1.25em;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--o)}.sr h3{color:var(--o2);font-size:1.02em;margin:16px 0 6px}
.sr p{margin:6px 0}.sr ul,.sr ol{margin:6px 0 6px 20px;padding:0}.sr li{margin:3px 0}.sr small,.sr .mu{color:#a8a597}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.toc a{border:1px solid var(--b);border-radius:999px;padding:4px 12px;background:var(--c);color:var(--tx);text-decoration:none;font-size:.9em}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.flow div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;position:relative}.flow b{color:var(--o2);display:block;margin-bottom:2px}.flow div:not(:last-child):after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--o);font-size:1.3em;z-index:2}
.tb{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92em}.tb th,.tb td{border:1px solid var(--b);padding:6px 8px;text-align:left;vertical-align:top}.tb th{background:var(--c2);color:var(--o2);font-weight:700}.tb td.c,.tb th.c{text-align:center}
.tb tr.hl td{background:rgba(163,150,101,.12)}.tb td.bad{background:rgba(201,104,95,.25)}.tb td.good{background:rgba(163,150,101,.22)}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;border-radius:50%;font-weight:800;color:#111;vertical-align:middle}
.sc1{background:#7d2f29;color:#fff}.sc2{background:var(--r);color:#fff}.sc3{background:#9a9a94}.sc4{background:var(--o)}.sc5{background:var(--o2)}
.box{background:var(--c);border:1px solid var(--b);border-left:5px solid var(--o);border-radius:8px;padding:10px 12px;margin:10px 0}.box.r{border-left-color:var(--r)}.box.y{border-left-color:var(--y)}
.ex{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin:14px 0}.ex h3{margin-top:0;font-size:1.1em}
.tagp{display:inline-block;border-radius:6px;padding:0 .5em;font-weight:700;font-size:.85em;background:var(--c2)}.tagp.n{background:rgba(201,104,95,.3);color:#f1d6d3}.tagp.p{background:var(--o);color:#111}.tagp.pp{background:var(--o2);color:#111}
.ov2{display:flex;align-items:center;gap:12px;margin:8px 0}.ov2 .sc{width:3em;height:3em;font-size:1.5em}
.sc-wrap{overflow-x:auto}.fm{font-family:ui-monospace,Menlo,monospace;background:#0b0b0b;border:1px solid var(--b);border-radius:6px;padding:1px 6px;font-size:.92em;white-space:nowrap}
@media(max-width:700px){.flow{grid-template-columns:1fr 1fr}.flow div:after{display:none}}
</style></head><body><div id="h"></div><div class="sr" id="app"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="scoring-examples.js"></script><script src="store.js"></script><script>
document.getElementById('h').innerHTML=hdr('Reglas de puntaje',hdrInfo(Store.get()),1);
const C=SCORING_CRITERIA,f=scoreFmt,L=n=>C.scoreLabels[n],sc=n=>`<span class="sc sc${n}">${n}</span>`;
const band=v=>{const l=levelOfScore(v);return `<span class="sc sc${l.score}" style="width:auto;padding:0 .45em;border-radius:1em">${f(v)}</span>`};
const VL={supNeg:['−−','n'],neg:['−','n'],pos:['+','p'],supPos:['++','pp']};
const chip=v=>`<span class="tagp ${VL[v][1]}">${VL[v][0]}</span>`;
const TAGB=PANEL_BUTTONS.find(c=>c.id=='tags').buttons,tl=k=>(TAGB.find(b=>b.key==k)||{label:k}).label;
const own={};C.areas.forEach(a=>(a.tags||[]).forEach(t=>own[t]=a.label));C.callTags.forEach(t=>own[t]='Selección de cobros (califica el cobro)');
const tagRows=TAGB.map(b=>`<tr><td>${b.label}</td><td>${((TAG_ALLOWED||{})[b.key]||['supNeg','neg','pos','supPos']).map(chip).join(' ')}</td><td>${own[b.key]||'No suma puntaje (solo aparece en Áreas de mejora)'}</td></tr>`).join('');
const amp=x=>3+(x-3)*(1+C.specialAmplify),A=Math.round(C.specialAmplify*100),D=C.difficulty;
const lev=C.levels;
const mk=(ok,bad,d)=>({games:[{id:1,difficulty:d,plays:[...Array(ok).fill(0).map(()=>({refs:[{name:'X',role:'L'}],call:'CCM',cat:'fouls',incident:'blockCharge',tags:{}})),...Array(bad).fill(0).map(()=>({refs:[{name:'X',role:'L'}],call:'ICCM',cat:'fouls',incident:'blockCharge',tags:{}}))]}]});
const diffRows=[[8,0],[7,1],[5,3]].map(([o,b])=>`<tr><td>${o} correctas, ${b} incorrecta(s)</td>${['easy','normal','hard'].map(d=>{const a=assessReferee(mk(o,b,d),'X').areas.callSelection.score;return `<td class="c">${band(a)}</td>`}).join('')}</tr>`).join('');
function ex(e){const r=assessReferee(e.t,SCORING_EXAMPLE_REF),x=r.byGame[0];
return `<div class="ex"><h3>${band(r.overall)} ${e.title}</h3><p>${e.story} <span class="mu">Dificultad: ${D.labels[e.difficulty]}.</span></p>
<table class="tb"><tr><th>Área</th><th class="c">Puntos</th><th class="c">Promedio</th><th class="c">Dificultad</th><th class="c">Tope</th><th class="c">Puntaje</th></tr>${Object.values(x.areas).map(a=>`<tr><td>${a.label}</td><td class="c">${a.n}</td><td class="c">${a.defaulted?'sin puntos':f(a.raw)}</td><td class="c">${a.defaulted?'–':(a.adj>0?'+':'')+f(a.adj)}</td><td class="c">${a.capped?'máx. '+f(Math.min(...a.capped.map(c=>C.causeCap[c.score]))):'–'}</td><td class="c">${band(a.score)}</td></tr>`).join('')}
<tr class="hl"><td><b>Global</b> = promedio de las áreas${r.reasons.length?' con tope':''}</td><td></td><td class="c">${f(x.avgAreas)}</td><td></td><td class="c">${r.reasons.length?'máx. '+f(Math.min(...x.causes.map(c=>C.causeCap[c.score]),x.areas&&Object.values(x.areas).some(a=>a.score<C.areaBelow)?C.globalCapIfAreaBelow:9)):'–'}</td><td class="c">${band(r.overall)}</td></tr></table>
${x.causes.length?`<p class="mu">Causa automática: ${x.causes.map(c=>c.label).join('; ')}.</p>`:''}</div>`}
document.getElementById('app').innerHTML=`
<h2 style="margin-top:8px">Reglas de puntaje</h2>
<p>Así se calcula la evaluación de cada árbitro en <b>un partido</b>. Todos los números de esta página se leen de la configuración del puntaje, así que siempre coinciden con lo que hace la herramienta, y los ejemplos del final los calcula la propia herramienta.</p>
<div class="toc"><a href="#s1">1 · La escala</a><a href="#s2">2 · Qué se registra</a><a href="#s3">3 · Puntos de cada jugada</a><a href="#s4">4 · Puntaje de cada área</a><a href="#s5">5 · Dificultad</a><a href="#s6">6 · Causas automáticas</a><a href="#s7">7 · Global</a><a href="#s8">8 · Consolidado</a><a href="#s9">9 · Ejemplos</a></div>
<div class="flow"><div><b>1. Jugadas</b>Cada decisión y cada tag da puntos (de 1 a 5).</div><div><b>2. Áreas</b>Cada área promedia sus puntos y se ajusta por dificultad.</div><div><b>3. Global</b>Promedio de las cinco áreas, con dos decimales.</div><div><b>4. Topes</b>Las decisiones graves limitan el puntaje.</div></div>
<div class="box"><b>La idea central:</b> <b>3,00 es el estándar.</b> Las decisiones correctas valen ${f(C.callPoints.correct)} y las incorrectas ${f(C.callPoints.incorrect)}; los tags suben o bajan el promedio de su área. Solo las <b>decisiones graves</b> de la sección 6 son causa automática de “Por debajo del estándar” o “No aceptable”. <b>Los tags por sí solos nunca son causa automática</b>: bajan o suben el promedio, pero no imponen un tope.</div>

<h2 id="s1">1 · La escala</h2>
<p>El puntaje se muestra con dos decimales (por ejemplo ${f(3.54)}), porque combina muchas variables y la diferencia entre ${f(3.1)} y ${f(3.6)} importa.</p>
<table class="tb"><tr><th class="c">Nivel</th><th>Nombre</th><th class="c">Puntaje</th><th>Significado</th></tr>
<tr><td class="c">${sc(5)}</td><td><b>${L(5)}</b></td><td class="c">${f(lev[0].min)} a ${f(C.maxPoint)}</td><td>Excepcional: decisiones clave correctas y se destaca en todas las áreas.</td></tr>
<tr><td class="c">${sc(4)}</td><td><b>${L(4)}</b></td><td class="c">${f(lev[1].min)} a ${f(lev[0].min-0.01)}</td><td>Claramente mejor que el estándar.</td></tr>
<tr class="hl"><td class="c">${sc(3)}</td><td><b>${L(3)}</b></td><td class="c">${f(lev[2].min)} a ${f(lev[1].min-0.01)}</td><td>El estándar esperado: técnicas y criterios bien aplicados, con errores ocasionales.</td></tr>
<tr><td class="c">${sc(2)}</td><td><b>${L(2)}</b></td><td class="c">${f(lev[3].min)} a ${f(lev[2].min-0.01)}</td><td><i>FIBA:</i> no alcanza el estándar esperado; se requiere mejorar en varias áreas clave.</td></tr>
<tr><td class="c">${sc(1)}</td><td><b>${L(1)}</b></td><td class="c">menos de ${f(lev[3].min)}</td><td><i>FIBA:</i> no cumple las expectativas básicas; cumplió uno o más criterios de evaluación inaceptable.</td></tr></table>

<h2 id="s2">2 · Qué se registra en cada jugada</h2>
<table class="tb"><tr><th>Dato</th><th>Cómo se usa</th></tr>
<tr><td><b>Resultado del cobro</b></td><td>COBRO CORRECTO y NO COBRO CORRECTO cuentan como correctos; COBRO INCORRECTO y NO COBRO INCORRECTO, como incorrectos. Solo las <b>faltas</b> y <b>violaciones</b> suman a Selección de cobros.</td></tr>
<tr><td><b>Posición y árbitro</b></td><td>Cada jugada guarda qué árbitro decidió y desde qué posición (Líder, Central o Seguidor). Con <b>Varios</b> se marcan dos o tres árbitros, cada uno con su posición: la jugada cuenta en la evaluación de cada uno.</td></tr>
<tr><td><b>IRS / Challenge</b></td><td>Se registra el <b>uso</b> (correcto o incorrecto), la <b>decisión final</b> luego de mirar la imagen (correcta, incorrecta o sin decisión si la imagen no permitió ver la acción) y <b>qué árbitros fueron</b> a la revisión (normalmente dos). Esa calificación cuenta para los que fueron, que son los responsables de la decisión final. En el Challenge también se registra el resultado (ganado, perdido o video no claro): sirve para las estadísticas y el seguimiento, pero <b>no suma ni resta puntos</b>, porque el cobro original ya se califica con Resultado del cobro.</td></tr>
<tr><td><b>Tags</b></td><td>Señalan qué debe trabajar o qué hizo bien el árbitro. Suben o bajan el promedio de su área (sección 3).</td></tr>
<tr><td><b>Error de reglas</b></td><td>Error en el conocimiento de las reglas, con impacto Malo o Muy malo para cada árbitro (sección 6). Comentario obligatorio.</td></tr>
<tr><td><b>Jugada especial ★</b></td><td>Solo para jugadas de impacto en el juego. Sus puntos pesan un ${A}% más (sección 3).</td></tr>
<tr><td><b>Tiempo crucial</b></td><td>Se marca solo según el tiempo: los últimos 2:00 del 4.º cuarto y todo el tiempo extra. Algunas causas automáticas son más graves en tiempo crucial.</td></tr></table>

<h2 id="s3">3 · Puntos de cada jugada</h2>
<table class="tb"><tr><th>Área</th><th>Qué da puntos</th><th class="c">Puntos</th></tr>
<tr><td rowspan="3">Selección de cobros</td><td>Decisión correcta (falta o violación)</td><td class="c">${f(C.callPoints.correct)}</td></tr>
<tr><td>Decisión incorrecta</td><td class="c">${f(C.callPoints.incorrect)}</td></tr>
<tr><td>Decisión incorrecta con Llamada fantasma ${chip('supNeg')}</td><td class="c">${f(C.callPoints.incorrectVeryNegative)}</td></tr><tr><td>Selección de cobros</td><td>Tag Principio de Ventaja/Desventaja ${chip('neg')} · ${chip('pos')}</td><td class="c">${f(C.tagPoints.neg)} · ${f(C.tagPoints.pos)}</td></tr>
<tr><td rowspan="2">Selección de cobros<br><small>solo para los árbitros que fueron a la revisión</small></td><td>IRS / Challenge: uso correcto · uso incorrecto</td><td class="c">${f(C.reviewPoints.useOk)} · ${f(C.reviewPoints.useKo)}</td></tr>
<tr><td>Decisión final correcta · incorrecta · sin decisión</td><td class="c">${f(C.reviewPoints.decisionOk)} · ${f(C.reviewPoints.decisionKo)} · no suma</td></tr>
<tr><td rowspan="4">Las otras cuatro áreas</td><td>Tag ${chip('supNeg')} muy negativo</td><td class="c">${f(C.tagPoints.supNeg)}</td></tr><tr><td>Tag ${chip('neg')} negativo</td><td class="c">${f(C.tagPoints.neg)}</td></tr><tr><td>Tag ${chip('pos')} positivo</td><td class="c">${f(C.tagPoints.pos)}</td></tr><tr><td>Tag ${chip('supPos')} muy positivo</td><td class="c">${f(C.tagPoints.supPos)}</td></tr></table>
<p><b>Jugada especial ★:</b> todos sus puntos se alejan un ${A}% más del 3, hacia arriba si fue buena y hacia abajo si fue mala. Decisión correcta ${f(C.callPoints.correct)} → ${f(amp(C.callPoints.correct))}; incorrecta ${f(C.callPoints.incorrect)} → ${f(amp(C.callPoints.incorrect))}; tag + ${f(C.tagPoints.pos)} → ${f(amp(C.tagPoints.pos))}; tag − ${f(C.tagPoints.neg)} → ${f(amp(C.tagPoints.neg))}.</p>
<h3>Tags y área a la que suman</h3>
<table class="tb"><tr><th>Tag</th><th>Calificaciones habilitadas</th><th>Área</th></tr>${tagRows}</table>

<h2 id="s4">4 · Puntaje de cada área</h2>
<ol><li>Se promedian los puntos del área en el partido.</li>
<li>Se suma el ajuste por dificultad (sección 5).</li>
<li>El resultado queda entre ${f(C.minPoint)} y ${f(C.maxPoint)}.</li>
<li>Si el área no tiene ningún punto en el partido, queda en <b>${f(C.noDataScore)}</b> (estándar) y no se ajusta por dificultad.</li>
<li>Si el área tiene una causa automática propia (sección 6), queda limitada al tope de esa causa.</li></ol>
<p class="mu">Ejemplo: Mecánica con un tag + (${f(C.tagPoints.pos)}) y uno − (${f(C.tagPoints.neg)}) → promedio ${f(3)}. Con un solo tag −, el área queda en ${f(C.tagPoints.neg)}: el evaluador solo vio ese aspecto y fue negativo.</p>

<h2 id="s5">5 · Dificultad del partido</h2>
<p>Al terminar el partido el evaluador elige qué tan exigente fue: <b>Fácil</b>, <b>Normal</b> o <b>Difícil</b>. Da más mérito al árbitro que trabajó bien en un partido difícil y no sobrevalora los partidos fáciles.</p>
<table class="tb"><tr><th>Dificultad</th><th class="c">Se suma a cada área con puntos</th></tr>${['easy','normal','hard'].map(k=>`<tr${k=='normal'?' class="hl"':''}><td><b>${D.labels[k]}</b></td><td class="c">${D.adjust[k]>0?'+':''}${f(D.adjust[k])}</td></tr>`).join('')}</table>
<p>No cambia las causas automáticas: una flagrante no cobrada es igual de grave en cualquier partido.</p>
<h3>Ejemplo: Selección de cobros con las mismas decisiones en tres partidos</h3>
<table class="tb"><tr><th>Decisiones</th>${['easy','normal','hard'].map(k=>`<th class="c">${D.labels[k]}</th>`).join('')}</tr>${diffRows}</table>

<h2 id="s6">6 · Causas automáticas</h2>
<p>Son decisiones graves. Cada una <b>limita</b> el puntaje: las de nivel 2 a un máximo de <b>${f(C.causeCap[2])}</b> (Por debajo del estándar) y las de nivel 1 a un máximo de <b>${f(C.causeCap[1])}</b> (No aceptable). Si el promedio ya es menor, queda el promedio. Limitan el global y, cuando tienen área, también esa área. Se evalúan para cada árbitro: la de IRS / Challenge alcanza a los árbitros que fueron a la revisión.</p>
<table class="tb"><tr><th>Criterio FIBA</th><th>Cómo se detecta</th><th class="c">Tope</th><th>Área</th></tr>${C.autoCauses.map(c=>`<tr><td>${c.fiba}</td><td>${c.label}</td><td class="c">${f(C.causeCap[c.score])}</td><td>${c.area?C.areas.find(a=>a.key==c.area).short:'Solo el global'}</td></tr>`).join('')}</table>
<div class="box y"><b>Los tags no son causa automática.</b> Muchos tags negativos bajan el promedio de su área (y con él el global), pero no imponen un tope. La única excepción es combinada con una decisión: un <b>error de reglas Malo</b> junto con ${C.rulesError.badCombo.supNeg} tag −− o ${C.rulesError.badCombo.neg} tags − en el mismo partido.</div>
<div class="box r"><b>Lo juzga el evaluador.</b> Situaciones como errores repetidos que afectan el resultado o un cambio de criterio en los últimos minutos no se detectan con un botón: registralas como decisiones incorrectas, marcá las jugadas clave como Jugada especial ★ y, si corresponde, usá Error de reglas.</div>

<h2 id="s7">7 · Global</h2>
<ol><li>Promedio de los cinco puntajes por área, con dos decimales.</li>
<li>Si hay causas automáticas, queda limitado al tope de la más grave (${f(C.causeCap[2])} o ${f(C.causeCap[1])}).</li>
<li>Si algún área queda debajo de ${f(C.areaBelow)}, el global no puede pasar de ${f(C.globalCapIfAreaBelow)} (no puede estar Por encima del estándar con un área por debajo).</li></ol>
<p class="mu">Como las áreas sin tags cuentan ${f(C.noDataScore)}, un global alto necesita decisiones correctas <b>y</b> aspectos positivos registrados en varias áreas.</p>

<h2 id="s8">8 · Consolidado (departamento arbitral)</h2>
<p>Cuando el departamento carga muchas evaluaciones, cada área de un árbitro es el <b>promedio de sus partidos</b> y el global es el <b>promedio de los globales de sus partidos</b> (cada uno ya con sus topes). También se muestra cuántos partidos tuvieron causa automática.</p>

<h2 id="s9">9 · Ejemplos</h2>
<p>Partidos hipotéticos de un árbitro, calculados por la herramienta con las reglas de arriba.</p>
${SCORING_EXAMPLES.map(ex).join('')}
`;
</script></body></html>
