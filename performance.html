</style></head><body><div id="h"></div><div class="wrap" id="app"></div><div id="tip"></div><div id="md"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
/* Seguimiento de desempeño (experimental) — solo en Consolidado.
   Reglas de conteo: con "Todos los árbitros" cada jugada y cada revisión se cuenta UNA vez aunque involucre a
   varios árbitros. Con un árbitro elegido se cuentan las jugadas donde está involucrado y las revisiones a las que fue. */
const T=Store.get(),A=document.getElementById('app');
document.getElementById('h').innerHTML=hdr('Seguimiento de desempeño',hdrInfo(T));
const C=SCORING_CRITERIA,F2=scoreFmt,isOk=c=>C.correctCalls.includes(c);
const PRE={fouls:'Falta',violations:'Violación',others:'Otros'},CATS=[['all','Todas'],['fouls','Faltas'],['violations','Violaciones'],['others','Otros']];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let F={ref:'all',tor:'all',per:'month',cat:'all',inc:'all'};
const incName=p=>p.incident=='other'?(p.iother||'Otro'):nm(p.incident);
const tName=p=>{const n=incName(p),pr=PRE[p.cat];return pr&&!n.toLowerCase().startsWith(pr.toLowerCase())?pr+': '+n:n};
const fmtT=t=>String(Math.floor((t||0)/60)).padStart(2,'0')+':'+String((t||0)%60).padStart(2,'0');
function perKey(date){const d=new Date(date+'T12:00:00');if(F.per=='month')return [date.slice(0,7),MES[d.getMonth()]+' '+String(d.getFullYear()).slice(2)];
 const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const k=m.toLocaleDateString('en-CA');return [k,'sem. '+String(m.getDate()).padStart(2,'0')+'/'+String(m.getMonth()+1).padStart(2,'0')]}
/* ---- tooltip ---- */
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.innerHTML=t.dataset.tip;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
const tq=s=>esc(s).replace(/'/g,'&#39;');
/* ---- gráficos SVG ---- */
const W=560;
function axisY(max,h,top,left,right,fmt){const st=niceStep(max);let s='';for(let v=0;v<=max+1e-9;v+=st){const y=top+h-(v/max)*h;s+=`<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${left-6}" y="${y+4}" text-anchor="end">${fmt?fmt(v):v}</text>`}return s}
function niceStep(max){const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r||1))),n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
const niceMax=v=>{const s=niceStep(Math.max(1,v));return Math.ceil(Math.max(1,v)/s)*s};
/* barras apiladas correctas (abajo) / incorrectas (arriba), una columna por período */
function stacked(per,h=190){if(!per.length)return '<div class="empty">Sin datos con estos filtros.</div>';const L=34,R=6,TOP=14,B=24,ph=h-TOP-B,max=niceMax(Math.max(...per.map(p=>p.ok+p.ko))),bw=(W-L-R)/per.length,cw=Math.min(46,bw*.62);
 let s=axisY(max,ph,TOP,L,R);per.forEach((p,i)=>{const x=L+i*bw+(bw-cw)/2,ho=p.ok/max*ph,hk=p.ko/max*ph,yb=TOP+ph;const tipT=`<b>${esc(p.label)}</b><br>Correctas: <b>${p.ok}</b><br>Incorrectas: <b>${p.ko}</b><br>${p.games} partido(s)`;
  s+=`<g class="m"><rect class="hl" x="${L+i*bw}" y="${TOP}" width="${bw}" height="${ph}"/>`;
  if(p.ok)s+=`<path d="${rbar(x,yb-ho,cw,ho,p.ko?0:4)}" fill="var(--ok)"/>`;if(p.ko)s+=`<path d="${rbar(x,yb-ho-hk-(p.ok?2:0),cw,hk,4)}" fill="var(--ko)"/>`;
  if(per.length<=16&&p.ko)s+=`<text class="lbl" x="${x+cw/2}" y="${yb-ho-hk-(p.ok?2:0)-4}" text-anchor="middle">${p.ko}</text>`;
  if(per.length<=16||i%Math.ceil(per.length/12)==0)s+=`<text x="${x+cw/2}" y="${h-6}" text-anchor="middle">${esc(p.label)}</text>`;
  s+=`<rect class="hit" x="${L+i*bw}" y="${TOP}" width="${bw}" height="${ph+B}" data-tip='${tq(tipT)}'/></g>`});return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img" aria-label="Correctas e incorrectas por período">${s}</svg>`}
const rbar=(x,y,w,h,r)=>{r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
/* línea del puntaje promedio (escala 1 a 5, banda del estándar) */
function scoreLine(per,h=190){const pts=per.filter(p=>p.score!=null);if(!pts.length)return '<div class="empty">Sin puntajes con estos filtros.</div>';const L=34,R=10,TOP=12,B=24,ph=h-TOP-B,lo=1,hi=5,y=v=>TOP+ph-(v-lo)/(hi-lo)*ph,bw=(W-L-R)/per.length,x=i=>L+i*bw+bw/2;
 let s='';[1,2,3,4,5].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
 s+=`<rect x="${L}" y="${y(3.74)}" width="${W-L-R}" height="${y(2.8)-y(3.74)}" fill="rgba(163,150,101,.10)"/><text x="${L+6}" y="${y(2.8)-5}">estándar 2,80–3,74</text>`;
 const seq=per.map((p,i)=>p.score==null?null:[x(i),y(p.score)]);let d='',pen=false;seq.forEach(q=>{if(!q){pen=false;return}d+=(pen?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1);pen=true});
 s+=`<path d="${d}" fill="none" stroke="var(--o2)" stroke-width="2"/>`;
 per.forEach((p,i)=>{if(per.length<=16||i%Math.ceil(per.length/12)==0)s+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${esc(p.label)}</text>`;if(p.score==null)return;
  s+=`<circle cx="${x(i)}" cy="${y(p.score)}" r="4.5" fill="var(--o2)" stroke="var(--c)" stroke-width="2"/>`;
  if(i==per.length-1||per.length<=8)s+=`<text class="lbl" x="${x(i)}" y="${y(p.score)-9}" text-anchor="middle">${F2(p.score)}</text>`;
  s+=`<rect class="hit" x="${L+i*bw}" y="${TOP}" width="${bw}" height="${ph}" data-tip='${tq(`<b>${esc(p.label)}</b><br>Puntaje promedio: <b>${F2(p.score)}</b><br>${p.nScores} evaluación(es) de árbitro`)}'/>`});
 return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img" aria-label="Puntaje promedio por período">${s}</svg>`}
/* columnas simples (una serie) para los mini gráficos y revisiones agrupadas */
function cols(per,key,color,h=110,label){const L=26,R=4,TOP=12,B=20,ph=h-TOP-B,max=niceMax(Math.max(...per.map(p=>p[key]))),bw=(W/2-L-R)/per.length,cw=Math.min(30,bw*.6),w2=W/2;
 let s='';const st=niceStep(max);for(let v=0;v<=max;v+=st){const y=TOP+ph-v/max*ph;s+=`<line x1="${L}" x2="${w2-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-5}" y="${y+4}" text-anchor="end">${v}</text>`}
 per.forEach((p,i)=>{const x=L+i*bw+(bw-cw)/2,hh=p[key]/max*ph;if(hh)s+=`<path d="${rbar(x,TOP+ph-hh,cw,hh,3)}" fill="${color}"/>`;if(per.length<=4||i%Math.ceil(per.length/4)==0)s+=`<text x="${x+cw/2}" y="${h-5}" text-anchor="middle">${esc(p.label.replace('sem. ',''))}</text>`;s+=`<rect class="hit" x="${L+i*bw}" y="${TOP}" width="${bw}" height="${ph}" data-tip='${tq(`<b>${esc(p.label)}</b><br>${esc(label)}: <b>${p[key]}</b>`)}'/>`});
 return `<svg class="ch" viewBox="0 0 ${w2} ${h}">${s}</svg>`}
function grouped(per,h=170){if(!per.length)return '<div class="empty">Sin revisiones con estos filtros.</div>';const L=30,R=6,TOP=14,B=24,ph=h-TOP-B,max=niceMax(Math.max(...per.map(p=>Math.max(p.irs,p.chl)))),bw=(W-L-R)/per.length,cw=Math.min(20,bw*.3);
 let s=axisY(max,ph,TOP,L,R);per.forEach((p,i)=>{const x0=L+i*bw+bw/2-cw-1;[['irs','var(--irs)'],['chl','var(--chl)']].forEach(([k,c],j)=>{const hh=p[k]/max*ph;if(hh)s+=`<path d="${rbar(x0+j*(cw+2),TOP+ph-hh,cw,hh,3)}" fill="${c}"/>`});
  if(per.length<=16||i%Math.ceil(per.length/12)==0)s+=`<text x="${L+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(p.label)}</text>`;
  s+=`<rect class="hit" x="${L+i*bw}" y="${TOP}" width="${bw}" height="${ph}" data-tip='${tq(`<b>${esc(p.label)}</b><br>IRS: <b>${p.irs}</b><br>Challenge: <b>${p.chl}</b>`)}'/>`});return `<svg class="ch" viewBox="0 0 ${W} ${h}">${s}</svg>`}
/* ---- datos ---- */
let ST=[];const reg=a=>(ST.push(a),ST.length-1);
function showPlays(title,i){const a=ST[i];document.getElementById('md').innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div class="w"><div style="display:flex;justify-content:space-between;color:var(--o)"><b>${esc(title)} · ${a.length} jugada(s)</b><button style="padding:4px;display:flex" onclick="this.closest('.modal').remove()">${IC.close}</button></div><div class="pl">${a.slice(0,300).map(({p,g})=>`<div><b>${esc(g.date||'')}</b> · ${esc(gameTitle(g))} · ${esc(p.q||'')} ${fmtT(p.time)}<br><span class="${isOk(p.call)?'ok':'ko'}">${esc(callLbl(p.call))}</span> · ${esc((PRE[p.cat]||'')+': '+incName(p))} · ${esc(refsTxt(p))}${p.comment?` · <i>“${esc(p.comment)}”</i>`:''}</div>`).join('')}${a.length>300?'<div>…</div>':''}</div><button onclick="this.closest('.modal').remove()">Cerrar</button></div></div>`}
/* ===== Ficha individual del árbitro (v7): progresión por partido ===== */
const avgA=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,f1=x=>x==null?'–':x.toFixed(1).replace('.',','),f2n=x=>x==null?'–':F2(x);
const lvcI=x=>x>=3.75?'#a39665':x>=2.8?'#bdb9ac':'#c9685f';
const DN={easy:'Fácil',normal:'Normal',hard:'Difícil'},sh=d=>(d||'').slice(8,10)+'/'+(d||'').slice(5,7);
const isNeg=v=>/neg|Neg/.test(v);
const POS_TAGS=['mechanicsPositioning','rotation','iot'];
function ficha(games,R,refsSel,tors){
 const G=games.filter(g=>(g.refs||[]).includes(R)||g.plays.some(p=>playInvolves(p,R)));
 const N=G.length;if(!N)return '<div class="card empty">Sin partidos para este árbitro con estos filtros.</div>';
 const AS=G.map(g=>assessReferee({games:[g]},R)),glob=AS.map(a=>a.overall);
 const half=Math.ceil(N/2),first=[...Array(half).keys()],last=[...Array(N).keys()].slice(half),two=last.length>0;
 const mine=g=>g.plays.filter(p=>playInvolves(p,R)),errs=g=>mine(g).filter(p=>p.call&&!isOk(p.call));
 const me=assessReferee({games:G},R),cat=((T.referees||[]).find(r=>r.name==R)||{}).cat||'';
 const pick=(a,ix)=>ix.map(i=>a[i]);
 const tipG=i=>`<b>P${i+1} · ${esc(G[i].date)}</b><br>${esc(gameTitle(G[i]))}<br>${DN[G[i].difficulty]||'Sin dificultad'} · Global <b>${F2(glob[i])}</b>${AS[i].causes.length?'<br>Con causa automática':''}`;
 const gPlays=i=>reg(mine(G[i]).map(p=>({p,g:G[i]})));
 // progresión
 const prog=()=>{const W=1200,H=230,L=34,Rr=10,TOP=16,B=46,ph=H-TOP-B,y=v=>TOP+ph-(v-1)/4*ph,bw=(W-L-Rr)/N,x=i=>L+i*bw+bw/2,step=Math.ceil(N/30);let s='';
  [1,2,3,4,5].forEach(v=>s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  s+=`<rect x="${L}" y="${y(3.74)}" width="${W-L-Rr}" height="${y(2.8)-y(3.74)}" fill="rgba(163,150,101,.10)"/><text x="${W-Rr-4}" y="${y(2.8)+13}" text-anchor="end">estándar 2,80–3,74</text>`;
  if(N>2){const mm=glob.map((_,i)=>avgA(glob.slice(Math.max(0,i-2),i+1)));s+=`<path d="${mm.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="#6b6040" stroke-width="2" stroke-dasharray="5 4"/>`}
  if(catAvg!=null)s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(catAvg)}" y2="${y(catAvg)}" stroke="var(--ok)" stroke-width="2"/>`;

 // posiciones y zonas (colectivo o del árbitro elegido): una jugada compartida cuenta para cada posición involucrada
 const posZones=()=>{const pr=[];refGames.forEach(g=>mine(g).filter(p=>p.call).forEach(p=>playRefs(p).forEach(r=>{if(F.ref=='all'||r.name==F.ref)pr.push({p,g,role:r.role})})));
  const court=role=>{const a=pr.filter(x=>x.role==role),ko=a.filter(x=>!isOk(x.p.call));const z=Array.from({length:16},(_,i)=>{const b=a.filter(x=>x.p.zone==i+1),k=b.filter(x=>!isOk(x.p.call));return `<span style="background:${!b.length?'transparent':k.length==0?'rgba(79,154,74,.35)':k.length*2>=b.length?'rgba(208,88,76,.6)':k.length*4>=b.length?'rgba(163,150,101,.45)':'rgba(79,154,74,.25)'}" ${b.length?`data-tip='${tq(`${ROLES[role][0]} · zona ${i+1}<br>${k.length} incorrecta(s) de ${b.length}`)}' onclick="showPlays(${esc(JSON.stringify(ROLES[role][0]+' · zona '+(i+1)))},${reg(b)})"`:''}>${b.length?k.length+'/'+b.length:''}</span>`}).join('');
   return `<div class="pz"><b>${ROLES[role][0]}</b> <span class="dim">${ko.length} de ${a.length}</span><div class="ct">${COURT}<div class="zg">${z}</div></div></div>`};
  return `<div class="pzg">${['L','C','T'].map(court).join('')}</div><div class="note">Verde: casi todas correctas · dorado: mezcla · rojo: la mitad o más incorrectas. Compará con la ficha de un árbitro para ver si un punto flojo es individual o de todo el grupo.</div>`};
 const rvRow=(t,l)=>`<tr><td><b>${l}</b></td><td class="c">${cnt(t,()=>1)}</td><td class="c ok">${cnt(t,r=>r.use=='ok')}</td><td class="c ko">${cnt(t,r=>r.use=='ko')}</td><td class="c ok">${cnt(t,r=>r.decision=='ok')}</td><td class="c ko">${cnt(t,r=>r.decision=='ko')}</td><td class="c">${cnt(t,r=>r.decision=='na')}</td></tr>`;
 const sm=[['CCM','COBRO CORRECTO','var(--ok)'],['CNC','NO COBRO CORRECTO','var(--ok)'],['ICCM','COBRO INCORRECTO','var(--ko)'],['ICNC','NO COBRO INCORRECTO','var(--ko)']];
 const who=F.ref=='all'?'Todos los árbitros':F.ref,incSel=F.inc!='all'?' · '+lbl(F.inc):'';
 A.innerHTML=`<div class="flt"><label>Árbitro<select onchange="F.ref=this.value;R()"><option value="all">Todos los árbitros (sumados)</option>${refs.map(n=>`<option ${F.ref==n?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select></label>
 <label>Torneo<select onchange="F.tor=this.value;F.inc='all';R()"><option value="all">Todos los torneos</option>${tors.map(t=>`<option ${F.tor==t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
 <label>Tipo de incidente<select onchange="F.cat=this.value;F.inc='all';R()">${CATS.map(([k,l])=>`<option value="${k}" ${F.cat==k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label>Agrupar por<select onchange="F.per=this.value;R()"><option value="month" ${F.per=='month'?'selected':''}>Mes</option><option value="week" ${F.per=='week'?'selected':''}>Semana</option></select></label></div>
 <h2 style="margin:4px 0 0;color:var(--o);font-size:1.15em">${esc(who)}${F.tor!='all'?' · '+esc(F.tor):''}<span class="exp">Experimental</span></h2>
 <div class="kp"><div><b>${refGames.length}</b><span>partidos</span></div><div><b>${dec.length}</b><span>decisiones${F.cat!='all'||F.inc!='all'?' (filtradas)':''}</span></div><div><b class="ok">${okN}</b><span>correctas</span></div><div><b class="ko">${dec.length-okN}</b><span>incorrectas</span></div><div><b>${rvs.length}</b><span>IRS / Challenge</span></div><div><b>${avgSc==null?'–':F2(avgSc)}</b><span>puntaje promedio</span></div></div>
 <div class="g2"><div class="card"><h3>Correctas e incorrectas por ${F.per=='month'?'mes':'semana'}<small>${esc(CATS.find(c=>c[0]==F.cat)[1]+incSel)}</small></h3><div class="lgd"><span><i style="background:var(--ok)"></i>Correctas</span><span><i style="background:var(--ko)"></i>Incorrectas (número arriba)</span></div>${stacked(per)}</div>
 <div class="card"><h3>Puntaje promedio por ${F.per=='month'?'mes':'semana'}<small>${F.ref=='all'?'promedio de todos los árbitros':'global de cada partido'}</small></h3>${scoreLine(per)}<div class="note">El puntaje usa todas las jugadas del partido (no aplica el filtro de tipo).</div></div></div>
 <div class="card"><h3>Evolución por resultado del cobro<small>${esc(CATS.find(c=>c[0]==F.cat)[1]+incSel)}</small></h3><div class="sm">${sm.map(([k,l,c])=>`<div class="card"><h4 style="color:${k=='CCM'||k=='CNC'?'#a9c9a4':'#e09a93'}">${l} · ${per.reduce((s,p)=>s+(p[k]||0),0)}</h4>${per.length?cols(per,k,c,110,l):'<div class="empty">–</div>'}</div>`).join('')}</div></div>
 <div class="g2"><div class="card"><h3>Por tipo de incidente<small>tocá un tipo para filtrar la evolución</small></h3><div class="lgd"><span><i style="background:var(--ok)"></i>Correctas</span><span><i style="background:var(--ko)"></i>Incorrectas</span></div><div class="ty">${types.map(t=>{const oc=`onclick="F.inc=F.inc=='${t.inc}'?'all':'${t.inc}';R()"`,tp=`data-tip='${tq(`<b>${esc(t.name)}</b><br>Correctas: <b>${t.ok}</b><br>Incorrectas: <b>${t.ko}</b>`)}'`;return `<span ${oc} class="${F.inc==t.inc?'on':''}">${esc(t.name)}</span><div class="bar" ${oc} ${tp}>${t.ok?`<i style="width:${t.ok/mt*100}%;background:var(--ok)"></i>`:''}${t.ko?`<i style="width:${t.ko/mt*100}%;background:var(--ko)"></i>`:''}</div><span class="v" ${oc}>${t.ko} de ${t.a.length}</span>`}).join('')||'<span class="empty">Sin datos.</span>'}</div>${F.inc!='all'?`<div class="note">Filtrando por <b>${esc(lbl(F.inc))}</b>. <a href="#" onclick="F.inc='all';R();return false">Quitar filtro</a></div>`:''}</div>
 <div class="card"><h3>IRS / Challenge</h3><div class="lgd"><span><i style="background:var(--irs)"></i>IRS</span><span><i style="background:var(--chl)"></i>Challenge</span></div>${grouped(per)}
 <table class="tbl"><tr><th></th><th class="c">Usos</th><th class="c">Uso correcto</th><th class="c">Uso incorrecto</th><th class="c">Decisión correcta</th><th class="c">Decisión incorrecta</th><th class="c">Sin decisión</th></tr>${rvRow('irs','IRS')}${rvRow('challenge','Challenge')}</table>
 <table class="tbl" style="margin-top:6px"><tr><th>Resultado del Challenge</th><th class="c">Ganado</th><th class="c">Perdido</th><th class="c">Video no claro</th><th class="c">Sin dato</th></tr><tr><td>Challenges</td><td class="c">${cnt('challenge',r=>r.result=='won')}</td><td class="c">${cnt('challenge',r=>r.result=='lost')}</td><td class="c">${cnt('challenge',r=>r.result=='unclear')}</td><td class="c">${cnt('challenge',r=>!r.result)}</td></tr></table></div></div>
 <div class="g2"><div class="card"><h3>Qué se revisa en IRS / Challenge<small>por tipo de incidente</small></h3>${rvByType()}</div>
 <div class="card"><h3>Posiciones y zonas${F.ref=='all'?' · todos los árbitros':''}<small>incorrectas / jugadas · tocá una zona</small></h3>${posZones()}</div></div>
 <div class="card"><h3>Los 5 errores más repetidos<small>todos los árbitros${F.tor!='all'?' · '+esc(F.tor):''} · cada jugada se cuenta una sola vez aunque involucre a varios árbitros</small></h3><div class="top5">${top.map((t,i)=>`<button onclick="showPlays(${esc(JSON.stringify(t.name+' · '+t.call))},${reg(t.a)})"><span class="rk">${i+1}</span><span><b>${esc(t.name)}</b><small>${esc(t.call)} · ${t.refs.size} árbitro(s)</small></span><span class="br" style="width:${t.a.length/tmax*100}%"></span><b class="n">${t.a.length}</b></button>`).join('')||'<span class="empty">No hay errores registrados.</span>'}</div><div class="note">Sirve para elegir los temas de las próximas capacitaciones. Tocá un error para ver las jugadas.</div></div>
 <p class="note">Sección experimental. Con “Todos los árbitros” cada jugada y cada revisión se cuentan una vez; con un árbitro elegido se cuentan sus jugadas (aunque sean compartidas) y las revisiones a las que fue. Sin porcentajes: se muestran cantidades.</p>`}
R();</script></body></html>
