<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5fc4"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Lista de juegos</title></head><body><div id="h"></div><div class="wrap" id="app"></div><script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
const T=Store.get();if(!T)location='index.html';let del=null;document.getElementById('h').innerHTML=hdr('Lista de juegos',esc(T.name));
function R(){const gs=[...T.games].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.n-a.n);
document.getElementById('app').innerHTML=gs.map(g=>`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="flex:1;min-width:0"><b>Juego #${g.n} · ${esc(g.teamA||'Local')} vs ${esc(g.teamB||'Visitante')}</b><br><span style="color:var(--o2)">Jornada ${g.day||'–'} · ${esc(g.date||'–')} · ${g.plays.length} jugadas · ${g.closed?'Cerrado':'En curso'}</span><br><span style="color:var(--mu)">${(g.refs||[]).filter(Boolean).map(esc).join(' / ')}</span>${g.evaluator||g.file?`<br><span style="color:var(--mu);font-size:.85em">${[g.evaluator&&'Evaluador: '+esc(g.evaluator),g.tournament&&g.tournament!=T.name&&esc(g.tournament),g.file&&'Archivo: '+esc(g.file)].filter(Boolean).join(' · ')}</span>`:''}</div>
<label style="display:flex;flex-direction:column;gap:3px;font-size:.8em;color:var(--mu)">Dificultad<select class="inp" style="width:auto;${g.closed&&!g.difficulty?'border-color:var(--o)':''}" onchange="setD(${g.id},this.value)"><option value="" ${g.difficulty?'':'selected'}>${g.closed?'Sin elegir (normal)':'Se elige al cerrar'}</option>${SCORING_CRITERIA.difficulty.options.map(o=>`<option value="${o.key}" ${g.difficulty==o.key?'selected':''}>${o.label}</option>`).join('')}</select></label>
<a class="big" style="margin:0;padding:10px 14px" href="play-by-play.html?game=${g.id}">${IC.edit}Abrir</a><button style="padding:12px" onclick="del=${g.id};R()" title="Borrar juego">${IC.trash}</button></div>`).join('')+
(del?`<div class="modal"><div><b>¿Borrar este juego y sus ${T.games.find(g=>g.id==del).plays.length} jugadas?</b><button class="dgr" onclick="T.games=T.games.filter(g=>g.id!=del);if(!Store.cur(T))Store.newGame(T);Store.set(T);del=null;R()">Borrar</button><button onclick="del=null;R()">Cancelar</button></div></div>`:'')}
function setD(id,v){const g=T.games.find(x=>x.id==id);if(v)g.difficulty=v;else delete g.difficulty;Store.set(T);R()}
R();</script></body></html>
