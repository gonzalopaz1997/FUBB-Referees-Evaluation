<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a39665"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Lista de juegos</title>
<style>.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.fb .inp{flex:1 1 12em;width:auto}.mt{max-height:68vh;overflow:auto}.modal>div.w{max-width:820px}.xr{display:flex;justify-content:space-between;align-items:center;color:var(--o)}.xr button{padding:4px;display:flex}.mt th{position:sticky;top:0;background:var(--c)}.ok{color:#a9c9a4}.ko{color:#e09a93}td,th{font-size:.9em}</style></head><body><div id="h"></div><div class="wrap" id="app"></div><script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
const T=Store.get();if(!T)location='index.html';let del=null,see=null,q='';document.getElementById('h').innerHTML=hdr('Lista de juegos',hdrInfo(T));
const DL=SCORING_CRITERIA.difficulty.labels,fmt=t=>String(Math.floor((t||0)/60)).padStart(2,'0')+':'+String((t||0)%60).padStart(2,'0');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function setDif(id,v){const g=T.games.find(x=>x.id==id);if(v)g.difficulty=v;else delete g.difficulty;Store.set(T)}
function R(){const gs=[...T.games].filter(g=>!q||norm([g.teamA,g.teamB,g.evaluator,g.tournament,(g.refs||[]).join(' ')].join(' ')).includes(norm(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.n-a.n);
document.getElementById('app').innerHTML=`<div class="fb"><input class="inp" id="q" placeholder="Buscar por equipo, árbitro, evaluador o competencia…" value="${esc(q)}" oninput="q=this.value;R();const e=document.getElementById('q');e.focus();e.setSelectionRange(q.length,q.length)"><span style="color:var(--o2);align-self:center">${gs.length} de ${T.games.length} juegos</span></div>`+
gs.map(g=>`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="flex:1;min-width:0"><b>${esc(gameTitle(g))}</b><br><span style="color:var(--o2)">${esc(g.date||'–')} · ${g.plays.length} jugadas · ${g.closed?'Cerrado':'En curso'}${g.tournament?' · '+esc(g.tournament):''}</span><br><label style="color:var(--o2);font-size:.9em">Dificultad <select style="margin-left:6px;padding:3px 6px" onchange="setDif(${g.id},this.value)">${[['','Sin elegir (Normal)'],['easy',DL.easy],['normal',DL.normal],['hard',DL.hard]].map(([v,l])=>`<option value="${v}" ${(g.difficulty||'')==v?'selected':''}>${l}</option>`).join('')}</select></label><br><span style="color:var(--m)">${(g.refs||[]).filter(Boolean).map(esc).join(' / ')}</span>${g.evaluator||g.file?`<br><span style="color:var(--m);font-size:.85em">${[g.evaluator&&'Evaluador: '+esc(g.evaluator),g.file&&'Archivo: '+esc(g.file)].filter(Boolean).join(' · ')}</span>`:''}</div>
<button class="big" style="margin:0;padding:10px 14px" onclick="see=${g.id};R()">${IC.list}Ver jugadas</button><button style="padding:12px" onclick="del=${g.id};R()" title="Borrar juego">${IC.trash}</button></div>`).join('')+
(del?`<div class="modal"><div><b>¿Borrar este juego y sus ${T.games.find(g=>g.id==del).plays.length} jugadas?</b><button class="dgr" onclick="T.games=T.games.filter(g=>g.id!=del);Store.clean(T);Store.set(T);del=null;R()">Borrar</button><button onclick="del=null;R()">Cancelar</button></div></div>`:'')+
(see?(()=>{const g=T.games.find(x=>x.id==see);return `<div class="modal" onclick="see=null;R()"><div class="w" onclick="event.stopPropagation()"><div class="xr"><b>${esc(gameTitle(g))} · ${g.plays.length} jugadas</b><button onclick="see=null;R()" title="Cerrar">${IC.close}</button></div><div class="mt"><table><tr><th>#</th><th>Período</th><th>Tiempo</th><th>Cobro</th><th>Árbitro</th><th>Posición</th><th>Incidente</th><th>Tags</th></tr>${g.plays.map(p=>`<tr><td>${p.n}</td><td>${p.q||'–'}</td><td>${fmt(p.time)}</td><td class="${okCall(p.call)?'ok':'ko'}"><b>${p.call}</b></td><td>${esc(p.referee)}</td><td>${roleName(p.role)}</td><td>${esc(p.incident?(p.incident=='other'?(p.iother||'Otro'):nm(p.incident)):(p.review||[]).map(k=>plain(lbl(k))).join(', ')||'–')}${Object.keys(p.rules||{}).length?' · <span class="ko">Error de reglas</span>':''}${p.comment?`<br><i style="color:var(--m)">“${esc(p.comment)}”</i>`:''}</td><td>${Object.entries(p.tags||{}).map(([k,v])=>esc(nm(k))+' '+({supNeg:'−−',neg:'−',pos:'+',supPos:'++'}[v]||'')).join(', ')||'–'}</td></tr>`).join('')}</table></div><button onclick="see=null;R()">Cerrar</button></div></div>`})():'')}
R();</script></body></html>
