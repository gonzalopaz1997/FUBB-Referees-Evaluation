<div class="hold"><div class="c${rq('Tiempo de juego')}"><div class="t">Tiempo de juego</div><div class="tm"><button onclick="adj(-1)" aria-label="Restar un segundo">−</button><input inputmode="numeric" value="${fmt(d.time)}" onfocus="this.select()" oninput="tin(this)" onblur="R()" onkeydown="if(event.key=='Enter')this.blur()"><button onclick="adj(1)" aria-label="Sumar un segundo">+</button></div>
<div class="ch">${PERIODS.map(([q])=>`<button class="${d.q==q?'on':''}" onclick="setQ('${q}')">${q}</button>`).join('')}<span>Crucial<br><b style="color:${cr(d)?'var(--o2)':'#8a877b'}">${cr(d)?'SÍ':'NO'}</b></span></div></div>
<div class="c${rq('Posición')}${rq('Árbitro')}"><div class="t">Posición y árbitro<button class="mt ${multi?'on':''}" onclick="setMulti(!multi)" title="Varios árbitros en la misma decisión" aria-label="Varios árbitros">${IC.users}</button></div><div class="rb" style="--n:${rs.length}">${rs.map(k=>{const own=multi?d.refs.find(r=>r.role==k&&r.name!=d.act):null,on=multi?(d.refs.find(r=>r.name==d.act)||{}).role==k:(d.refs[0]?d.refs[0].role==k:d.pr==k);return `<button class="${on?'on':''}" ${own?'disabled title="Ya la tiene '+esc(own.name)+'"':''} onclick="pickRole('${k}')">${roleName(k)}</button>`}).join('')}${refsG().map(r=>{const x=d.refs.find(y=>y.name==r),act=multi?d.act==r:!!x;return `<button class="nm ${act?'on':x?'in':''}" data-r="${esc(r)}" onclick="pickRef(this.dataset.r)" title="${esc(r)}"><span>${esc(multi&&x?shortN(r):r)}</span>${multi&&x?`<small>${x.role?roleAb(x.role):'¿posición?'}</small>`:''}</button>`}).join('')}</div></div></div>
<div class="c inc${rq('Tipo de incidente')}"><div class="t">${IC.warn} Tipo de incidente</div><div class="cols">
${['fouls','violations'].map(c=>`<div class="grp"><div class="gt">${P(c).title}</div><div class="g">${P(c).buttons.map(b=>`<button class="${d.incident==b.key?'on':''}" onclick="pick('${c}','${b.key}')">${bl(b.label)}</button>`).join('')}<input class="oth ${d.incident=='other'&&d.cat==c?'on':''}" maxlength="30" placeholder="${c=='fouls'?'Otra falta…':'Otra…'}" value="${d.cat==c?esc(d.iother):''}" oninput="ioth(this,'${c}')"></div></div>`).join('')}
<div class="grp"><div class="gt">Otros</div><div class="g" style="flex:2">${P('others').buttons.map(b=>`<button class="${d.incident==b.key?'on':''}" onclick="pick('others','${b.key}')">${bl(b.label)}</button>`).join('')}<input class="oth ${d.incident=='other'&&d.cat=='others'?'on':''}" maxlength="30" placeholder="Otro…" value="${d.cat=='others'?esc(d.iother):''}" oninput="ioth(this,'others')"></div>
<div class="rv"><div class="gt">Sistema de revisión <button class="ibtn" onclick="info='review';R()" title="Info">${IC.info}</button></div>${[['irs','IRS'],['challenge','Challenge']].map(([k,l])=>{const r=d.reviews.find(x=>x.type==k);return `<button class="rvb ${r?'on':''}" onclick="openRv('${k}')"><b>${l}</b><span>${r?`Uso ${r.use=='ok'?'✓':'✗'} · Decisión ${r.decision=='ok'?'✓':r.decision=='ko'?'✗':'s/d'}${r.result?' · '+CHR[r.result]:''}<br>${r.refs.map(n=>esc(n.split(' ')[0])).join(', ')}`:'Registrar'}</span></button>`}).join('')}</div></div>
</div></div>
<div class="cm"><input class="${mi.includes(CMR)?'req':''}" maxlength="120" placeholder="${hasRules(d)?CMR:'Comentario (opcional)'}" value="${esc(d.comment)}" oninput="d.comment=this.value"><button class="sp rx ${hasRules(d)?'on':''}" onclick="rm=true;R()">${IC.warn} Error de reglas</button><button class="sp ${d.special?'on':''}" onclick="if(d.special){d.special=false}else{spm=true}R()">${IC.star} Jugada especial</button></div>
<div class="act"><button class="rec ${ed?'u':''}" onclick="rec()">${ed?'Actualizar jugada':'Registrar jugada'}</button><button onclick="cancel()">${IC.close} Cancelar</button></div></section>
<aside><section class="c${rq('Ubicación en cancha')}"><div class="t">${IC.pin} Ubicación en cancha</div><div class="court">${COURT}${Array.from({length:16},(_,i)=>`<button class="z ${d.zone==i+1?'on':''}" aria-label="Zona ${i+1}" onclick="d.zone=${i+1};R()"></button>`).join('')}</div><button class="bcz ${d.zone==17?'on':''}" onclick="d.zone=17;R()">Campo trasero</button></section>
<section class="c" style="flex:1;display:flex;flex-direction:column"><div class="t">Tags</div><div class="tg" id="tg">${tags()}</div></section></aside></main>
${fin?`<div class="modal"><div><b>¿Terminar el juego?</b><span style="color:var(--o2)">${esc(gameTitle(G))} · ${esc(G.date)} · ${G.plays.length} jugadas</span><div class="dfx ${fderr?'err':''}"><div class="gt">Dificultad del juego${fderr?' — elegí una':''}</div><div class="dfb">${['easy','normal','hard'].map(k=>`<button class="${fdif==k?'on':''}" onclick="fdif='${k}';fderr=false;R()">${SCORING_CRITERIA.difficulty.labels[k]}</button>`).join('')}</div><small>¿Qué tan exigente fue este juego para los árbitros? El buen trabajo en un juego difícil vale más; en uno fácil, menos.</small></div><button class="cta" onclick="close_()">Terminar y guardar</button><button onclick="fin=false;R()">Cancelar</button></div></div>`:''}
${spm?(()=>{const a=SCORING_CRITERIA.specialAmplify,P=SCORING_CRITERIA.callPoints,f=x=>scoreFmt(3+(x-3)*(1+a));return `<div class="modal"><div class="spd"><div class="xr"><b>${IC.star} Jugada especial</b><button onclick="spm=false;R()" title="Cancelar">${IC.close}</button></div><span>Reservala para <b>jugadas de impacto en el juego</b>: una decisión que define el resultado, un momento clave o una situación de alta presión.</span><div class="spf"><div><b>+${Math.round(a*100)}%</b><small>si la jugada fue buena<br>${scoreFmt(P.correct)} → ${f(P.correct)}</small></div><div><b>−${Math.round(a*100)}%</b><small>si la jugada fue mala<br>${scoreFmt(P.incorrect)} → ${f(P.incorrect)}</small></div></div><span style="color:var(--m)">Todos los puntos de esta jugada (cobro y tags) se alejan un ${Math.round(a*100)}% más del 3, hacia arriba o hacia abajo.</span><button class="cta" onclick="d.special=true;spm=false;R()">Aceptar</button><button onclick="spm=false;R()">Cancelar</button></div></div>`})():''}
${rvm?(()=>{const r=rvd,L=rvm=='challenge'?'Challenge':'IRS',b=(k,v,l,c)=>`<button class="${r[k]==v?'on '+c:''}" onclick="rvd.${k}='${v}';R()">${l}</button>`;return `<div class="modal"><div class="rvd"><div class="xr"><b>${L}</b><button onclick="rvm=null;R()" title="Cerrar">${IC.close}</button></div><div class="gt">Uso</div><div class="b2">${b('use','ok','Correcto','g')}${b('use','ko','Incorrecto','r')}</div><div class="gt">Decisión final luego de mirar la imagen</div><div class="b3">${b('decision','ok','Correcta','g')}${b('decision','ko','Incorrecta','r')}${b('decision','na','Sin decisión','n')}</div><small>Sin decisión: la imagen no permitió ver la acción; solo cuenta el uso.</small>${rvm=='challenge'?`<div class="gt">Resultado del Challenge</div><div class="b3">${b('result','won','Ganado','g')}${b('result','lost','Perdido','r')}${b('result','unclear','Video no claro','n')}</div><small>Ganado: el entrenador tenía razón y se cambió la decisión. Perdido: se mantuvo la decisión. Video no claro: la imagen no permitió resolver.</small>`:''}<div class="gt">Árbitros que fueron a la revisión</div><div class="b3">${refsG().map(n=>`<button class="nm2 ${r.refs.includes(n)?'on':''}" data-r="${esc(n)}" onclick="rvRef(this.dataset.r)">${esc(n)}</button>`).join('')}</div><small>Normalmente van dos; sumá el tercero solo si lo llamaron porque no se ponían de acuerdo.</small><div class="rp-err" id="rve"></div><button class="cta" onclick="saveRv()">Listo</button>${d.reviews.some(x=>x.type==rvm)?`<button class="dgr" onclick="d.reviews=d.reviews.filter(x=>x.type!=rvm);rvm=null;R()">Quitar ${L}</button>`:''}<button onclick="rvm=null;R()">Cancelar</button></div></div>`})():''}
${snd?`<div class="modal"><div class="snd"><div class="okm">${IC.ok} Juego terminado. Evaluación guardada.</div><b style="color:var(--o)">Enviá la evaluación al departamento arbitral</b><div class="mail"><span id="mto">${esc(sendTo())}</span><button onclick="copyMail()">Copiar</button></div><button class="cta" onclick="shareEval()">${IC.ul} Compartir evaluación</button><small>En iPad, iPhone o Android se abre el menú Compartir con el archivo adjunto: elegí Mail y enviá. En computadora se descarga el archivo y se abre un correo nuevo a esa dirección: adjuntá el archivo descargado.</small><button onclick="Store.download(T)">${IC.dl} Descargar evaluación</button><small>Descargá el archivo si preferís enviarlo más tarde a mano, desde tu correo, adjuntándolo.</small><button onclick="G.sent=true;G.sentAt=new Date().toISOString();Store.set(T);location='index.html'">Ya la envié</button><button onclick="location='index.html'">Más tarde</button></div></div>`:''}
${delId?`<div class="modal"><div><b>¿Borrar la jugada #${G.plays.find(p=>p.id==delId).n}?</b><span style="color:var(--m)">No se puede deshacer.</span><button class="dgr" onclick="delPlay()">Borrar</button><button onclick="delId=null;R()">Cancelar</button></div></div>`:''}
${rm?`<div class="modal"><div class="rmd"><div class="xr"><b>Error de reglas</b><button onclick="rm=false;R()" title="Cerrar">${IC.close}</button></div><small>Calificá el impacto para cada árbitro; puede ser distinto para cada uno. El comentario es obligatorio.</small>${refsG().map((n,i)=>`<div class="rro"><b>${esc(n)}</b>${[['','Ninguno'],['bad','Malo'],['veryBad','Muy malo']].map(([v,l])=>`<button class="${(d.rules[n]||'')==v?'on '+(v||'none'):''}" onclick="setRules(${i},'${v}')">${l}</button>`).join('')}</div>`).join('')}<input maxlength="120" placeholder="Comentario (obligatorio)" value="${esc(d.comment)}" oninput="d.comment=this.value"><button class="cta" onclick="rm=false;R()">Listo</button></div></div>`:''}
${info?`<div class="modal i" onclick="info=null;R()"><div onclick="event.stopPropagation()"><div class="xr"><b>${INFO[info][0]}</b><button onclick="info=null;R()" title="Cerrar">${IC.close}</button></div><span>${INFO[info][1]}</span><button onclick="info=null;R()">Cerrar</button></div></div>`:''}</div>`;
const nl=document.querySelector('.list');if(nl)nl.scrollTop=st}
function tags(){return P('tags').buttons.map(b=>{const v=d.tags[b.key];
const name=b.key=='other'?`<input placeholder="Otro…" maxlength="30" value="${esc(d.otherText)}" oninput="d.otherText=this.value">`:`<span class="n">${b.label}${b.key=='crossedCallDw'?` <button class="ibtn" onclick="info='crossedCallDw';R()" title="Info">${IC.info}</button>`:''}</span>`;
return `<div class="tr ${v?'s':''}">${name}${TAG_VALUES.map(x=>`<button class="vb ${x.key} ${v==x.key?'on':''}" title="${VI[x.key][1]}" ${tagAllows(b.key,x.key)?'':'disabled'} onclick="sv('${b.key}','${x.key}')">${VI[x.key][0]}</button>`).join('')}</div>`}).join('')}
function sv(k,v){if(d.tags[k]==v)delete d.tags[k];else d.tags[k]=v;document.getElementById('tg').innerHTML=tags()}
function setRules(i,v){const n=refsG()[i];if(v)d.rules[n]=v;else delete d.rules[n];R()}
function pick(c,k){if(d.incident==k){d.incident='';d.cat=''}else{d.cat=c;d.incident=k}d.iother='';R()}
function ioth(e,c){d.iother=e.value;document.querySelectorAll('input.oth').forEach(i=>{if(i!==e){i.value='';i.classList.remove('on')}});if(e.value.trim()){d.cat=c;d.incident='other';e.classList.add('on')}else if(d.incident=='other'){d.incident='';d.cat='';e.classList.remove('on')}
const iw=document.querySelector('.inc');if(iw){iw.classList.toggle('req',!hasInc(d));iw.querySelectorAll('.grp .g button').forEach(b=>b.classList.remove('on'))}}
function openRv(k){const r=d.reviews.find(x=>x.type==k);rvd=r?JSON.parse(JSON.stringify(r)):{type:k,use:null,decision:null,refs:d.refs.map(x=>x.name).slice(0,2)};rvm=k;R()}
function rvRef(n){const i=rvd.refs.indexOf(n);if(i>=0)rvd.refs.splice(i,1);else rvd.refs.push(n);R()}
function saveRv(){const e=document.getElementById('rve');if(!rvd.use)return e.textContent='Marcá si el uso fue correcto o incorrecto.';if(!rvd.decision)return e.textContent='Marcá la decisión final (correcta, incorrecta o sin decisión).';if(rvm=='challenge'&&!rvd.result)return e.textContent='Marcá el resultado del Challenge (ganado, perdido o video no claro).';if(!rvd.refs.length)return e.textContent='Marcá qué árbitros fueron a la revisión.';if(rvm!='challenge')delete rvd.result;
d.reviews=d.reviews.filter(x=>x.type!=rvm);d.reviews.push(rvd);rvm=null;R()}
function setMulti(v){multi=v;if(!v){d.refs=d.refs.slice(0,1);d.act=null}else d.act=d.refs[0]?d.refs[0].name:null;R()}
function pickRef(n){if(multi){const x=d.refs.find(r=>r.name==n);if(x){if(d.act==n){d.refs=d.refs.filter(r=>r.name!=n);d.act=d.refs.length?d.refs[d.refs.length-1].name:null}else d.act=n}else{const used=d.refs.some(r=>r.role==d.pr);d.refs.push({name:n,role:used?null:d.pr});d.pr=null;d.act=n}}
else{const role=d.refs[0]?d.refs[0].role:d.pr;d.refs=d.refs[0]&&d.refs[0].name==n?[]:[{name:n,role}]}R()}
function pickRole(k){if(multi){const x=d.refs.find(r=>r.name==d.act);if(x)x.role=x.role==k?null:k;else d.pr=d.pr==k?null:k}else{if(d.refs[0])d.refs[0].role=d.refs[0].role==k?null:k;else d.pr=d.pr==k?null:k}R()}
function copyMail(){const t=sendTo();try{navigator.clipboard.writeText(t).then(()=>er('Correo copiado'),()=>{})}catch(e){}}
function shareEval(){Store.share(T).then(r=>{if(r=='shared'){G.sent=true;G.sentAt=new Date().toISOString();Store.set(T);location='index.html'}})}
function tin(e){const g=e.value.replace(/\D/g,'').slice(0,4),n=+g||0,m=g.length<=2?0:Math.floor(n/100),s=g.length<=2?n:n%100;d.time=Math.min(m*60+Math.min(s,59),pmax(d.q));d.timeSet=true}
function adj(x){d.time=Math.max(0,Math.min(pmax(d.q),d.time+x));d.timeSet=true;R()}
function setQ(q){if(d.q!=q){d.q=q;d.time=pmax(q);d.timeSet=false}R()}
function gs(k,v){G[k]=v;Store.set(T)}
function askFin(){if(!G.teamA.trim()||!G.teamB.trim())return er('Completá Local y Visitante antes de terminar el juego.');fdif=G.difficulty||'';fderr=false;fin=true;R()}
function setRef(i,v){const old=G.refs[i];G.refs[i]=v;d.refs=d.refs.filter(r=>r.name!=old);if(d.act==old)d.act=null;if(!G.refs[2])d.refs.forEach(r=>{if(r.role=='C')r.role=null});Store.set(T);R()}
function er(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',3500)}
function cancel(){ed=null;multi=false;d=nd({q:d.q,time:d.time});R()}
function rec(){const m=missing();if(m.length)return er('Falta completar: '+m.join(', '));
const t={...d.tags};if(d.otherText.trim()&&!t.other)return er('Calificá el tag “Otro” (de muy negativo a muy positivo).');if(t.other&&!d.otherText.trim())delete t.other;
const p={...d,tags:t,refs:d.refs.map(r=>({...r})),reviews:JSON.parse(JSON.stringify(d.reviews)),rules:{...d.rules},crucial:cr(d)};delete p.timeSet;delete p.act;delete p.pr;delete p.review;p.referee=p.refs[0].name;p.role=p.refs[0].role;
if(ed){const i=G.plays.findIndex(x=>x.id==ed);p.id=ed;p.n=G.plays[i].n;G.plays[i]=p}else{p.id=Date.now();p.n=G.plays.length+1;G.plays.push(p)}
Store.set(T);ed=null;sel=null;multi=false;d=nd({q:d.q,time:d.time});R()}
function mod(id){const p=G.plays.find(x=>x.id==id);d=nd(JSON.parse(JSON.stringify(p)));d.timeSet=true;multi=d.refs.length>1;d.act=multi?d.refs[0].name:null;ed=id;R()}
function delPlay(){G.plays=G.plays.filter(p=>p.id!=delId);G.plays.forEach((p,i)=>p.n=i+1);if(ed==delId){ed=null;d=nd({q:d.q,time:d.time})}delId=null;sel=null;Store.set(T);R()}
function close_(){if(!fdif){fderr=true;R();return}G.difficulty=fdif;G.closed=true;G.closedAt=new Date().toISOString();G.sent=false;Store.set(T);fin=false;snd=true;R()}
R();
</script></body></html>
