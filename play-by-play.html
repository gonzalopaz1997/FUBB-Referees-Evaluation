</style></head><body><div id="app"></div><div id="toast"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script>
const T=Store.get();if(!T||Store.mode=='cons')location='index.html';
let G=T.games[0]||Store.newGame(T);
function init(){if(!G.refs)G.refs=T.referees.map(r=>r.name);G.refs=[...G.refs,'','',''].slice(0,3);
if(!G.date)G.date=T.date||new Date().toLocaleDateString('en-CA');G.teamA=G.teamA||'';G.teamB=G.teamB||'';G.evaluator=T.evaluator||G.evaluator||'';G.tournament=T.name||G.tournament||'';Store.set(T)}init();
const INFO={review:['Sistema de revisión (IRS / Challenge)','El ✓ o la ✗ califican el uso correcto del sistema de revisión, no la decisión final. La decisión final se marca en Resultado del cobro.'],
crossedCallDw:['Cobro cruzado/DW','Usá este tag solo para el árbitro que cobra fuera de su área primaria de cobertura.'],
calls:['Resultado del cobro','Cobro correcto: el cobro estuvo bien. Cobro incorrecto: se cobró algo que no correspondía. No cobro incorrecto: había que cobrar y no se cobró. No cobro correcto: no había nada que cobrar y no se cobró. En la lista de jugadas se abrevian CC, CI, NCI y NCC.']};
const PER=Object.fromEntries(PERIODS),pmax=q=>PER[q]||600;
const nd=o=>({call:null,role:null,referee:null,q:'1C',time:600,timeSet:false,cat:'',incident:'',iother:'',review:[],rules:{},zone:null,tags:{},otherText:'',comment:'',special:false,...o});
let d=nd(),ed=null,sel=null,fin=false,delId=null,info=null,rm=false,fdif='',fderr=false,fbk=true,tm;
const P=id=>PANEL_BUTTONS.find(c=>c.id==id),PRE={fouls:'Falta',violations:'Violación',others:'Otros'},A=document.getElementById('app');

const refsG=()=>G.refs.filter(Boolean),roles=()=>refsG().length>=3?['L','C','T']:['L','T'];
const SHY={'Descalificante':'Descalifi&shy;cante','Interposición':'Interpo&shy;sición','Interferencia':'Interfe&shy;rencia'};
const bl=l=>SHY[l]||esc(l);
const VI={supNeg:[IC.down2,'Muy negativo'],neg:[IC.down,'Negativo'],pos:[IC.up,'Positivo'],supPos:[IC.up2,'Muy positivo']};
const RUL={bad:'Malo',veryBad:'Muy malo'};
const incLabel=p=>{const a=[];if(p.incident)a.push((PRE[p.cat]||'Otros')+' - '+(p.incident=='other'?(p.iother||'Otro'):lbl(p.incident)));(p.review||[]).forEach(k=>a.push(plain(lbl(k))));const rv=Object.values(p.rules||{});if(rv.length)a.push('Error de reglas ('+[...new Set(rv)].map(v=>RUL[v]).join('/')+')');return a.join(' + ')||'–'};
const hasRules=x=>Object.keys(x.rules||{}).length>0,hasInc=x=>!!x.incident||x.review.length>0||hasRules(x);
const CMR='Comentario (obligatorio por error de reglas)';
const missing=()=>{const m=[];if(!d.call)m.push('Resultado del cobro');if(!d.timeSet)m.push('Tiempo de juego');if(!d.role)m.push('Posición');if(!d.referee||!refsG().includes(d.referee))m.push('Árbitro');if(!hasInc(d))m.push('Tipo de incidente');if(!d.zone)m.push('Ubicación en cancha');if(hasRules(d)&&!d.comment.trim())m.push(CMR);return m};
const REFL=['Principal','Auxiliar 1','Auxiliar 2'];
function R(){const L=document.querySelector('.list'),st=L?L.scrollTop:0,pl=G.plays,mi=missing(),rq=k=>mi.includes(k)?' req':'',rs=roles();
A.innerHTML=`<div class="app">${hdr('Evaluación de Árbitros',hdrInfo(T))}
<main class="m"><aside>
<section class="c gi"><div class="t">Datos del juego ${G.closed?'<span style="margin-left:auto;font-size:.8em;color:var(--o2)">Cerrado</span>':''}</div><label>Local<input placeholder="Equipo local" value="${esc(G.teamA)}" oninput="gs('teamA',this.value)"></label><label>Visitante<input placeholder="Equipo visitante" value="${esc(G.teamB)}" oninput="gs('teamB',this.value)"></label><label>Fecha<input type="date" value="${esc(G.date)}" onchange="gs('date',this.value)"></label><div class="ev">Evaluador: <b>${esc(T.evaluator||'–')}</b></div></section>
<section class="c"><div class="t">Terna arbitral</div>${[0,1,2].map(i=>`<label class="rl"><span>${REFL[i]}</span><select onchange="setRef(${i},this.value)">${i==2?`<option value="" ${!G.refs[2]?'selected':''}>— Sin (dupla)</option>`:''}${T.referees.map(r=>`<option value="${esc(r.name)}" ${G.refs[i]==r.name?'selected':''} ${G.refs.some((x,j)=>j!=i&&x==r.name)?'disabled':''}>${esc(r.name)} (${esc(r.cat)})</option>`).join('')}</select></label>`).join('')}</section>
<section class="c pl"><div class="t">${IC.play} Jugadas (${pl.length})</div><div class="list">${pl.slice().reverse().map(p=>`<div class="p ${sel==p.id?'s':''}" onclick="sel=sel==${p.id}?null:${p.id};R()"><b>#${p.n}</b><span>${p.q||''} ${fmt(p.time)}</span><b class="${okCall(p.call)?'ok':'ko'}" title="${callLbl(p.call)}">${callAb(p.call)}</b><span class="lt">${roleAb(p.role)}</span><span class="i">${esc(incLabel(p))}</span>${p.special?`<span class="star">${IC.star}</span>`:''}${sel==p.id?`<button title="Modificar jugada" onclick="event.stopPropagation();mod(${p.id})">${IC.edit}</button><button title="Borrar jugada" onclick="event.stopPropagation();delId=${p.id};R()">${IC.trash}</button>`:''}</div>`).join('')}</div>
<button class="fin" onclick="${G.closed?"location='index.html'":'askFin()'}">${G.closed?IC.back+' Volver al inicio':IC.flag+' Terminar juego'}</button></section></aside>
<section>
<div class="c${rq('Resultado del cobro')}"><div class="t ${ed?'mod':''}">${IC.play} ${ed?'Modificar jugada':'Nueva jugada'} <span style="color:var(--o2);font-size:.85em;margin-left:.6vw">Resultado del cobro</span><button class="ibtn" style="margin-left:.4vw" onclick="info='calls';R()" title="Qué significa cada uno">${IC.info}</button></div><div class="cr">${P('callResult').buttons.map(b=>`<button class="${d.call==b.key?'on '+(okCall(b.key)?'okc':'koc'):''}" onclick="d.call='${b.key}';R()"><b>${b.label}</b></button>`).join('')}</div></div>
<div class="hold"><div class="c${rq('Tiempo de juego')}"><div class="t">Tiempo de juego</div><div class="tm"><button onclick="adj(-1)" aria-label="Restar un segundo">−</button><input inputmode="numeric" value="${fmt(d.time)}" onfocus="this.select()" oninput="tin(this)" onblur="R()" onkeydown="if(event.key=='Enter')this.blur()"><button onclick="adj(1)" aria-label="Sumar un segundo">+</button></div>
<div class="ch">${PERIODS.map(([q])=>`<button class="${d.q==q?'on':''}" onclick="setQ('${q}')">${q}</button>`).join('')}<span>Crucial<br><b style="color:${cr(d)?'var(--o2)':'#8a877b'}">${cr(d)?'SÍ':'NO'}</b></span></div></div>
<div class="c${rq('Posición')}${rq('Árbitro')}"><div class="t">Posición y árbitro</div><div class="rb" style="--n:${rs.length}">${rs.map(k=>`<button class="${d.role==k?'on':''}" onclick="d.role='${k}';R()">${roleName(k)}</button>`).join('')}${refsG().map(r=>`<button class="nm ${d.referee==r?'on':''}" data-r="${esc(r)}" onclick="d.referee=this.dataset.r;R()" title="${esc(r)}"><span>${esc(r)}</span></button>`).join('')}</div></div></div>
<div class="c inc${rq('Tipo de incidente')}"><div class="t">${IC.warn} Tipo de incidente</div><div class="cols">
${['fouls','violations'].map(c=>`<div class="grp"><div class="gt">${P(c).title}</div><div class="g">${P(c).buttons.map(b=>`<button class="${d.incident==b.key?'on':''}" onclick="pick('${c}','${b.key}')">${bl(b.label)}</button>`).join('')}<input class="oth ${d.incident=='other'&&d.cat==c?'on':''}" maxlength="30" placeholder="${c=='fouls'?'Otra falta…':'Otra…'}" value="${d.cat==c?esc(d.iother):''}" oninput="ioth(this,'${c}')"></div></div>`).join('')}
<div class="grp"><div class="gt">Otros</div><div class="g" style="flex:2">${P('others').buttons.map(b=>`<button class="${d.incident==b.key?'on':''}" onclick="pick('others','${b.key}')">${bl(b.label)}</button>`).join('')}<input class="oth ${d.incident=='other'&&d.cat=='others'?'on':''}" maxlength="30" placeholder="Otro…" value="${d.cat=='others'?esc(d.iother):''}" oninput="ioth(this,'others')"></div>
<div class="rv"><div class="gt">Sistema de revisión <button class="ibtn" onclick="info='review';R()" title="Info">${IC.info}</button></div>${[['Uso IRS','correctUseIrs','incorrectUseIrs'],['Challenge','correctChallenge','incorrectChallenge']].map(r=>`<div class="rr"><span>${r[0]}</span><button class="ok ${d.review.includes(r[1])?'on':''}" title="${r[0]} correcto" onclick="rv('${r[1]}','${r[2]}')">${IC.ok}</button><button class="no ${d.review.includes(r[2])?'on':''}" title="${r[0]} incorrecto" onclick="rv('${r[2]}','${r[1]}')">${IC.no}</button></div>`).join('')}</div></div>
</div></div>
<div class="cm"><input class="${mi.includes(CMR)?'req':''}" maxlength="120" placeholder="${hasRules(d)?CMR:'Comentario (opcional)'}" value="${esc(d.comment)}" oninput="d.comment=this.value"><button class="sp rx ${hasRules(d)?'on':''}" onclick="rm=true;R()">${IC.warn} Error de reglas</button><button class="sp ${d.special?'on':''}" onclick="d.special=!d.special;R()">${IC.star} Jugada especial</button></div>
<div class="act"><button class="rec ${ed?'u':''}" onclick="rec()">${ed?'Actualizar jugada':'Registrar jugada'}</button><button onclick="cancel()">${IC.close} Cancelar</button></div></section>
<aside><section class="c${rq('Ubicación en cancha')}"><div class="t">${IC.pin} Ubicación en cancha</div><div class="court">${COURT}${Array.from({length:16},(_,i)=>`<button class="z ${d.zone==i+1?'on':''}" aria-label="Zona ${i+1}" onclick="d.zone=${i+1};R()"></button>`).join('')}</div><button class="bcz ${d.zone==17?'on':''}" onclick="d.zone=17;R()">Campo trasero</button></section>
<section class="c" style="flex:1;display:flex;flex-direction:column"><div class="t">Tags</div><div class="tg" id="tg">${tags()}</div></section></aside></main>
${fin?`<div class="modal"><div><b>¿Terminar el juego?</b><span style="color:var(--o2)">${esc(gameTitle(G))} · ${esc(G.date)} · ${G.plays.length} jugadas</span><div class="dfx ${fderr?'err':''}"><div class="gt">Dificultad del juego${fderr?' — elegí una':''}</div><div class="dfb">${['easy','normal','hard'].map(k=>`<button class="${fdif==k?'on':''}" onclick="fdif='${k}';fderr=false;R()">${SCORING_CRITERIA.difficulty.labels[k]}</button>`).join('')}</div><small>¿Qué tan exigente fue este juego para los árbitros? El buen trabajo en un juego difícil vale más; en uno fácil, menos.</small></div><label><input type="checkbox" id="bk" ${fbk?'checked':''} onchange="fbk=this.checked"> Descargar la evaluación (.txt) para mandarla al departamento arbitral</label><button class="cta" onclick="close_()">Terminar y guardar</button><button onclick="fin=false;R()">Cancelar</button></div></div>`:''}
${delId?`<div class="modal"><div><b>¿Borrar la jugada #${G.plays.find(p=>p.id==delId).n}?</b><span style="color:var(--m)">No se puede deshacer.</span><button class="dgr" onclick="delPlay()">Borrar</button><button onclick="delId=null;R()">Cancelar</button></div></div>`:''}
${rm?`<div class="modal"><div class="rmd"><div class="xr"><b>Error de reglas</b><button onclick="rm=false;R()" title="Cerrar">${IC.close}</button></div><small>Calificá el impacto para cada árbitro; puede ser distinto para cada uno. El comentario es obligatorio.</small>${refsG().map((n,i)=>`<div class="rro"><b>${esc(n)}</b>${[['','Ninguno'],['bad','Malo'],['veryBad','Muy malo']].map(([v,l])=>`<button class="${(d.rules[n]||'')==v?'on '+(v||'none'):''}" onclick="setRules(${i},'${v}')">${l}</button>`).join('')}</div>`).join('')}<input maxlength="120" placeholder="Comentario (obligatorio)" value="${esc(d.comment)}" oninput="d.comment=this.value"><button class="cta" onclick="rm=false;R()">Listo</button></div></div>`:''}
${info?`<div class="modal i" onclick="info=null;R()"><div onclick="event.stopPropagation()"><div class="xr"><b>${INFO[info][0]}</b><button onclick="info=null;R()" title="Cerrar">${IC.close}</button></div><span>${INFO[info][1]}</span><button onclick="info=null;R()">Cerrar</button></div></div>`:''}</div>`;
const nl=document.querySelector('.list');if(nl)nl.scrollTop=st}
function tags(){return P('tags').buttons.map(b=>{const v=d.tags[b.key];
const name=b.key=='other'?`<input placeholder="Otro…" maxlength="30" value="${esc(d.otherText)}" oninput="d.otherText=this.value">`:`<span class="n">${b.label}${b.key=='crossedCallDw'?` <button class="ibtn" onclick="info='crossedCallDw';R()" title="Info">${IC.info}</button>`:''}</span>`;
return `<div class="tr ${v?'s':''}">${name}${TAG_VALUES.map(x=>`<button class="vb ${x.key} ${v==x.key?'on':''}" title="${VI[x.key][1]}" ${tagAllows(b.key,x.key)?'':'disabled'} onclick="sv('${b.key}','${x.key}')">${VI[x.key][0]}</button>`).join('')}</div>`}).join('')}
function sv(k,v){if(d.tags[k]==v)delete d.tags[k];else d.tags[k]=v;document.getElementById('tg').innerHTML=tags()}
function setRules(i,v){const n=refsG()[i];if(v)d.rules[n]=v;else delete d.rules[n];R()}
function pick(c,k){if(d.incident==k){d.incident='';d.cat=''}else{d.cat=c;d.incident=k}d.iother='';R()}
function ioth(e,c){d.iother=e.value;document.querySelectorAll('input.oth').forEach(i=>{if(i!==e){i.value='';i.classList.remove('on')}});if(e.value.trim()){d.cat=c;d.incident='other';e.classList.add('on')}else if(d.incident=='other'){d.incident='';d.cat='';e.classList.remove('on')}
const iw=document.querySelector('.inc');if(iw){iw.classList.toggle('req',!hasInc(d));iw.querySelectorAll('.grp .g button').forEach(b=>b.classList.remove('on'))}}
function rv(k,other){const i=d.review.indexOf(k);if(i>=0)d.review.splice(i,1);else{d.review=d.review.filter(x=>x!=other);d.review.push(k)}R()}
function tin(e){const g=e.value.replace(/\D/g,'').slice(0,4),n=+g||0,m=g.length<=2?0:Math.floor(n/100),s=g.length<=2?n:n%100;d.time=Math.min(m*60+Math.min(s,59),pmax(d.q));d.timeSet=true}
function adj(x){d.time=Math.max(0,Math.min(pmax(d.q),d.time+x));d.timeSet=true;R()}
function setQ(q){if(d.q!=q){d.q=q;d.time=pmax(q);d.timeSet=false}R()}
function gs(k,v){G[k]=v;Store.set(T)}
function askFin(){if(!G.teamA.trim()||!G.teamB.trim())return er('Completá Local y Visitante antes de terminar el juego.');fdif=G.difficulty||'';fderr=false;fin=true;R()}
function setRef(i,v){const old=G.refs[i];G.refs[i]=v;if(d.referee==old)d.referee=null;if(!G.refs[2]&&d.role=='C')d.role=null;Store.set(T);R()}
function er(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',3500)}
function cancel(){ed=null;d=nd({q:d.q,time:d.time});R()}
function rec(){const m=missing();if(m.length)return er('Falta completar: '+m.join(', '));
const t={...d.tags};if(d.otherText.trim()&&!t.other)return er('Calificá el tag “Otro” (de muy negativo a muy positivo).');if(t.other&&!d.otherText.trim())delete t.other;
const p={...d,tags:t,review:[...d.review],rules:{...d.rules},crucial:cr(d)};delete p.timeSet;
if(ed){const i=G.plays.findIndex(x=>x.id==ed);p.id=ed;p.n=G.plays[i].n;G.plays[i]=p}else{p.id=Date.now();p.n=G.plays.length+1;G.plays.push(p)}
Store.set(T);ed=null;sel=null;d=nd({q:d.q,time:d.time});R()}
function mod(id){const p=G.plays.find(x=>x.id==id);d=nd(JSON.parse(JSON.stringify(p)));d.timeSet=true;ed=id;R()}
function delPlay(){G.plays=G.plays.filter(p=>p.id!=delId);G.plays.forEach((p,i)=>p.n=i+1);if(ed==delId){ed=null;d=nd({q:d.q,time:d.time})}delId=null;sel=null;Store.set(T);R()}
function close_(){if(!fdif){fderr=true;R();return}G.difficulty=fdif;G.closed=true;G.closedAt=new Date().toISOString();Store.set(T);if(fbk)Store.download(T);setTimeout(()=>location='index.html',fbk?400:0)}
R();
</script></body></html>
