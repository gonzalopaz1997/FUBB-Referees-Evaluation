<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b5fc4"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Estadísticas</title>
<style>
html,body{height:100%;overflow:hidden;padding:0}
.app{width:100%;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);font-size:clamp(12px,2vh,24px);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;--cw:15.5vw;--ch:24vh}
@media(max-width:1300px){.app{--cw:12.5vw;--ch:20vh}}
.m{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--cw)*3 + 4vw);gap:1vw;padding:1vh 1vw 2.2vh;min-height:0}.m>div{display:flex;flex-direction:column;gap:1vh;min-height:0;min-width:0}
.c{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:.8vh .8vw;min-height:0}.c .t{display:flex;align-items:center;gap:.5vw;margin-bottom:.6vh}.c .t .ic{color:var(--o2)}
.c button{line-height:1.1}
table{font-size:.9em;font-variant-numeric:tabular-nums}td,th{padding:.55vh .4vw;border-bottom:1px solid var(--b)}th{color:var(--mu);font-weight:600;font-size:.85em}td.n{white-space:nowrap}
td button.v{background:none;border:0;padding:.3vh .4vw;font-weight:700;border-radius:6px;white-space:nowrap}td button.v small{font-weight:400;opacity:.75}th{white-space:nowrap}td button.v:active,td button.v:hover{background:var(--c2)}
.g{color:#8fe0b5}.y{color:#ffe066}.r{color:#ff9f98}.na{color:var(--m)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.6vh .5vw}
.chip{display:flex;align-items:stretch;border:1px solid var(--b);border-radius:8px;background:var(--c2);overflow:hidden;min-width:0}
.chip.on{border-color:var(--o);background:rgba(255,217,15,.12)}
.chip .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:.6vh .5vw!important;font-size:.86em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .pc{background:rgba(0,0,0,.22);border:0;border-left:1px solid var(--b);border-radius:0;padding:0 .5vw!important;font-size:.82em;font-weight:700;white-space:nowrap}
.courts{display:flex;gap:.8vw}.courts>div{display:flex;flex-direction:column;gap:.5vh;width:var(--cw)}.courts .lb{display:flex;flex-direction:column;align-items:center;color:var(--o2);font-weight:700;font-size:.85em;gap:.2vh;min-height:3.6em}.courts .lb button.v{background:var(--c2);border:1px solid var(--b);border-radius:6px;padding:.2vh .5vw;font-weight:700;white-space:nowrap}
.court{width:var(--cw);height:var(--ch)}.z{cursor:default}.z.has{cursor:pointer}
.z.g1{background:rgba(76,195,138,.55)}.z.y1{background:rgba(255,217,15,.5)}.z.r1{background:rgba(239,107,99,.6)}
.bcz{border:1px dashed var(--b);border-radius:6px;background:#123a6b;padding:.4vh 0;font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);text-align:center}.bcz.g1{background:rgba(76,195,138,.55);color:var(--tx)}.bcz.y1{background:rgba(255,217,15,.5);color:var(--ink)}.bcz.r1{background:rgba(239,107,99,.6);color:var(--tx)}
.lg{display:flex;gap:1vw;flex-wrap:wrap;font-size:.8em;color:var(--mu);align-items:center}.lg i{display:inline-block;width:1em;height:1em;border-radius:3px;vertical-align:-.15em;margin-right:.35em;border:1px solid var(--b)}
.fb{display:flex;gap:.6vw;align-items:center;flex-wrap:wrap}.fb select{max-width:100%;flex:1 1 46%;background:var(--in);border:1px solid var(--b);border-radius:8px;padding:.6vh .5vw;font-size:.95em;flex:1;min-width:0}
.fb button{display:flex;align-items:center;gap:.4vw;white-space:nowrap}.act{font-size:.85em;color:var(--o2);margin-top:.5vh}
.mt{max-height:68vh;overflow:auto;-webkit-overflow-scrolling:touch}.modal>div.w{max-width:760px}.modal .xr{display:flex;justify-content:space-between;align-items:center;color:var(--o)}.modal .xr button{padding:4px;display:flex}
.mt th{position:sticky;top:0;background:var(--c)}
</style></head><body><div id="app"></div>
<script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script src="referee-pool.js"></script><script>
const T=Store.get();if(!T)location='index.html';
const F={ref:'all',inc:null,cat:'all',tor:'all'};let modal=null;const A=document.getElementById('app');
const all=T.games.flatMap(g=>g.plays.map(p=>({p,g})));
const incKey=p=>p.incident||'';
const incName=k=>k=='other'?'Otro':lbl(k);
const KO=a=>a.filter(x=>!okCall(x.p.call)).length;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const byInc=a=>F.inc?a.filter(x=>incKey(x.p)==F.inc):a;
const showPlays=(title,arr)=>{modal={title,arr};R()};
const CAT=Object.fromEntries(T.referees.map(r=>[r.name,r.cat])),withPlays=new Set(all.map(x=>x.p.referee));
const cats=[...new Set(T.referees.filter(r=>withPlays.has(r.name)).map(r=>r.cat))].sort((a,b)=>((window.CATEGORIES||[]).indexOf(a)+99)%99-((window.CATEGORIES||[]).indexOf(b)+99)%99),tors=[...new Set(T.games.map(g=>g.tournament).filter(Boolean))].sort();
const pass=x=>(F.cat=='all'||CAT[x.p.referee]==F.cat)&&(F.tor=='all'||x.g.tournament==F.tor);
let store=[];const reg=a=>{store.push(a);return store.length-1};
const q=s=>JSON.stringify(s).replace(/"/g,'&quot;');
/* Las jugadas son una selección del evaluador: se muestran cantidades (incorrectas de registradas), nunca porcentajes. */
const cell=(title,a)=>{if(!a.length)return '<span class="na">–</span>';const k=KO(a);return `<button class="v ${k?'r':'g'}" onclick="showPlays(${q(title)},store[${reg(a)}])">${k}<small>/${a.length}</small></button>`};
const cnt=(title,a)=>a.length?`<button class="v" onclick="showPlays(${q(title)},store[${reg(a)}])">${a.length}</button>`:'<span class="na">0</span>';
function R(){store=[];const pool=all.filter(pass),base=byInc(pool),refA=base.filter(x=>F.ref=='all'||x.p.referee==F.ref);
const incs=[...new Set(pool.filter(x=>(F.ref=='all'||x.p.referee==F.ref)&&incKey(x.p)).map(x=>incKey(x.p)))].map(k=>({k,a:pool.filter(x=>(F.ref=='all'||x.p.referee==F.ref)&&incKey(x.p)==k)})).sort((a,b)=>KO(b.a)-KO(a.a)||b.a.length-a.a.length);
const rows=T.referees.map(r=>({r,a:base.filter(x=>x.p.referee==r.name)})).filter(o=>o.a.length).sort((x,y)=>KO(y.a)-KO(x.a)||y.a.length-x.a.length).map(({r,a})=>{return `<tr><td class="n">${esc(r.name)} <span class="na">(${r.cat})</span></td><td>${cnt(r.name+' · Jugadas registradas',a)}</td><td>${cell(r.name+' · Todas las jugadas',a)}</td>${['L','C','T'].map(k=>`<td>${cell(r.name+' · '+roleName(k),a.filter(x=>x.p.role==k))}</td>`).join('')}<td>${cell(r.name+' · Tiempo crucial',a.filter(x=>x.p.crucial))}</td></tr>`}).join('');
const zKo=[];['L','C','T'].forEach(r=>{for(let z=1;z<=17;z++)zKo.push(KO(refA.filter(x=>x.p.role==r&&x.p.zone==z)))});const mx=Math.max(1,...zKo);
const zs=z=>{if(!z.length)return['',''];const k=KO(z);return k?['r1',`background:rgba(239,107,99,${(.14+.78*k/mx).toFixed(2)})`]:['g1','']};
const court=role=>{const name=roleName(role),a=refA.filter(x=>x.p.role==role),bz=a.filter(x=>x.p.zone==17),[bc,bst]=zs(bz);return `<div><div class="lb"><span>${name}</span>${cell(name+' · '+(F.ref=='all'?'Todos los árbitros':F.ref),a)}</div><div class="court">${COURT}${Array.from({length:16},(_,i)=>{const z=a.filter(x=>x.p.zone==i+1),[c,st]=zs(z);return `<button class="z ${c} ${z.length?'has':''}" style="${st}" aria-label="Zona ${i+1}" ${z.length?`onclick="showPlays(${q(name+' · Zona '+(i+1))},store[${reg(z)}])"`:'tabindex=-1'}></button>`}).join('')}</div><button class="bcz ${bc}" style="${bst}" ${bz.length?`onclick="showPlays(${q(name+' · Campo trasero')},store[${reg(bz)}])"`:'tabindex=-1'}>Campo trasero${bz.length?' · '+KO(bz)+'/'+bz.length:''}</button></div>`};
const filt=F.ref!='all'||F.inc||F.cat!='all'||F.tor!='all';
A.innerHTML=`<div class="app">${hdr('Estadísticas',esc(T.name)+'<br>'+esc(T.date||''))}<main class="m">
<div><section class="c" style="flex:1.25;overflow:auto"><div class="t">${IC.stats} Decisiones por árbitro <span class="na" style="font-weight:400;font-size:.85em;margin-left:auto">Incorrectas / jugadas registradas</span></div><table><tr><th>Árbitro</th><th>Jugadas</th><th>Incorr.</th><th>Líder</th><th>Central</th><th>Seguidor</th><th>Crucial</th></tr>${rows||'<tr><td colspan="7" class="na">No hay jugadas con estos filtros.</td></tr>'}</table></section>
<section class="c" style="flex:1;overflow:auto"><div class="t">${IC.list} Por tipo de incidente <span class="na" style="font-weight:400;font-size:.85em;margin-left:auto">Tocá un nombre para filtrar las canchas</span></div><div class="chips">${incs.map(i=>{const k=KO(i.a);return `<div class="chip ${F.inc==i.k?'on':''}"><button class="nm" onclick="F.inc=F.inc=='${i.k}'?null:'${i.k}';R()">${esc(incName(i.k))}</button><button class="pc ${k?'r':'g'}" onclick="showPlays(${q(incName(i.k))},store[${reg(i.a)}])">${k}/${i.a.length}</button></div>`}).join('')||'<span class="na">Todavía no hay jugadas registradas.</span>'}</div></section></div>
<div><section class="c"><div class="t">${IC.pin} Incorrectas por zona de cancha</div><div class="courts">${court('L')}${court('C')}${court('T')}</div></section>
<section class="c"><div class="fb"><select onchange="F.ref=this.value;R()"><option value="all">Todos los árbitros</option>${T.referees.filter(r=>withPlays.has(r.name)).map(r=>`<option value="${esc(r.name)}" ${F.ref==r.name?'selected':''}>${esc(r.name)} (${r.cat})</option>`).join('')}</select><select onchange="F.cat=this.value;R()"><option value="all">Todas las categorías</option>${cats.map(c=>`<option ${F.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select>${tors.length>1?`<select onchange="F.tor=this.value;R()"><option value="all">Todos los torneos</option>${tors.map(t=>`<option ${F.tor==t?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select>`:''}<button ${filt?'':'disabled style="opacity:.4"'} onclick="F.ref='all';F.inc=null;F.cat='all';F.tor='all';R()">${IC.close} Quitar filtros</button></div>
<div class="act">${pool.length} jugadas en ${new Set(pool.map(x=>x.g)).size} juegos · ${F.inc?'Incidente: <b>'+esc(incName(F.inc))+'</b>':'Incidente: todos'} · Árbitro: <b>${F.ref=='all'?'todos':esc(F.ref)}</b></div>
<div class="lg" style="margin-top:.8vh"><span><i style="background:rgba(76,195,138,.6)"></i>Solo correctas</span><span><i style="background:linear-gradient(90deg,rgba(239,107,99,.15),rgba(239,107,99,.92))"></i>Con incorrectas (más intenso = más)</span><span><i style="background:#123a6b"></i>Sin jugadas</span></div>
<div class="lg" style="margin-top:.6vh">Se muestran cantidades, no porcentajes: el evaluador registra solo una parte de las decisiones del juego.</div></section></div></main>
${modal?`<div class="modal" onclick="modal=null;R()"><div class="w" onclick="event.stopPropagation()"><div class="xr"><b>${esc(modal.title)} · ${modal.arr.length} jugadas</b><button onclick="modal=null;R()" title="Cerrar">${IC.close}</button></div><div class="mt"><table><tr><th>Juego</th><th>Período</th><th>Tiempo</th><th>Cobro</th><th>Árbitro</th><th>Posición</th><th>Incidente</th></tr>${[...modal.arr].sort((a,b)=>a.g.n-b.g.n||(a.p.q||'').localeCompare(b.p.q||'')||b.p.time-a.p.time).map(x=>`<tr><td>${esc(x.g.teamA||'Local')} vs ${esc(x.g.teamB||'Visitante')}</td><td>${x.p.q||'–'}</td><td>${fmt(x.p.time)}</td><td class="${okCall(x.p.call)?'g':'r'}"><b>${x.p.call}</b></td><td>${esc(x.p.referee)}</td><td>${roleName(x.p.role)}</td><td>${esc((x.p.incident?incName(x.p.incident):'')||(x.p.review||[]).map(k=>plain(lbl(k))).join(', ')||'–')}</td></tr>`).join('')}</table></div><button onclick="modal=null;R()">Cerrar</button></div></div>`:''}</div>`}
R();</script></body></html>
