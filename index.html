<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5fc4"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>FUBB 5x5 Evaluación de Árbitros</title></head><body><div id="h"></div><div class="wrap" style="max-width:600px" id="app"></div><script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script src="referee-pool.js"></script><script src="ref-picker.js"></script><script>
const A=document.getElementById('app');let NS=[],MS=[];
function R(){const T=Store.get();document.getElementById('h').innerHTML=hdr('Evaluación de Árbitros',T?esc(T.name):'',0);
const ev=T?[...new Set(T.games.map(g=>g.evaluator).filter(Boolean))].length:0;
A.innerHTML=T?`<div class="card"><b>${esc(T.name)}</b><br><span style="color:var(--o2)">${T.consolidated?`${T.games.length} juegos · ${allPlays(T).length} jugadas · ${ev} evaluador(es) · ${T.referees.length} árbitros`:`${esc(T.date||'')} · ${T.days} jornada(s) · ${T.referees.length} árbitros · ${T.games.length} juegos${T.evaluator?' · Evaluador: '+esc(T.evaluator):''}`}</span></div>
${T.consolidated?'':`<a class="big" href="play-by-play.html">${IC.play}Jugada a jugada</a>`}<a class="big" href="games.html">${IC.list}Lista de juegos</a><a class="big" href="statistics-view.html">${IC.stats}Estadísticas</a><a class="big" href="evaluation.html">${IC.eval}Evaluación</a><a class="big" href="instructions.html">${IC.book}Instrucciones</a>
<div class="row"><button onclick="manage()">${IC.users} Árbitros</button><button onclick="Store.download(Store.get())">${IC.dl} Respaldo</button>${T.consolidated?'':`<button onclick="document.getElementById('f').click()">${IC.ul} Torneo en curso</button>`}<button onclick="document.getElementById('fm').click()">${IC.ul} Cargar evaluaciones</button><button onclick="document.getElementById('x').style.display='flex'">${IC.trash} Reiniciar</button><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"><input id="fm" type="file" accept=".txt,.json" multiple hidden onchange="mg(this)"></div>`
:`<div class="card"><h3>Nuevo torneo</h3><div style="display:grid;gap:8px"><input class="inp" id="n" placeholder="Nombre del torneo"><input class="inp" id="ev" placeholder="Evaluador (tu nombre)"><input class="inp" id="d" type="date"><input class="inp" id="y" type="number" min="1" value="1" placeholder="Cantidad de jornadas"></div></div>
<div class="card"><h3>Árbitros</h3><div id="rp"></div><div class="rp-err" id="ne" style="margin-top:10px"></div><button class="cta" style="width:100%;margin-top:6px" onclick="mk()">Empezar torneo</button></div>
<div class="card"><h3>Retomar un torneo existente</h3><button style="width:100%" onclick="document.getElementById('f').click()">${IC.ul} Cargar torneo en curso (.txt)</button><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"></div>
<div class="card"><h3>Consolidar evaluaciones (departamento arbitral)</h3><span style="color:var(--mu);font-size:.9em">Elegí todos los .txt que mandaron los evaluadores (se pueden seleccionar cientos a la vez) para ver estadísticas y evaluaciones conjuntas. Los juegos repetidos se cargan una sola vez.</span><button style="width:100%;margin-top:8px" onclick="document.getElementById('fm').click()">${IC.ul} Cargar evaluaciones (.txt)</button><input id="fm" type="file" accept=".txt,.json" multiple hidden onchange="mg(this)"></div>`;
A.insertAdjacentHTML('beforeend','<div class="modal" id="x" style="display:none"><div><b>¿Borrar el torneo de este navegador?</b><span style="color:var(--mu)">Descargá un respaldo antes. No se puede deshacer.</span><button class="dgr" onclick="localStorage.removeItem(Store.K);NS=[];R()">Borrar</button><button onclick="document.getElementById(\'x\').style.display=\'none\'">Cancelar</button></div></div>');
if(!T)RefPicker.mount(document.getElementById('rp'),NS,{onChange:()=>{const e=document.getElementById('ne');if(e)e.textContent=''}})}
function mk(){const n=document.getElementById('n').value.trim(),e=document.getElementById('ne');
if(!n)return e.textContent='Escribí el nombre del torneo.';if(NS.length<2)return e.textContent='Seleccioná al menos 2 árbitros.';if(!RefPicker.valid(NS))return e.textContent='Asigná una categoría a cada árbitro.';
const t={name:n,evaluator:document.getElementById('ev').value.trim(),date:document.getElementById('d').value,days:+document.getElementById('y').value||1,referees:RefPicker.clean(NS),games:[]};Store.newGame(t);Store.set(t);NS=[];R()}
function manage(){const T=Store.get(),lk=new Set();T.games.forEach(g=>{(g.refs||[]).forEach(x=>x&&lk.add(x));g.plays.forEach(p=>lk.add(p.referee))});MS=T.referees.map(r=>({...r}));
const m=document.createElement('div');m.className='modal';m.id='mr';m.innerHTML=`<div style="max-width:600px;max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;color:var(--o)"><b>Árbitros del torneo</b><button style="padding:4px;display:flex" onclick="closeM()" title="Cerrar">${IC.close}</button></div><span style="color:var(--mu);font-size:.9em">Los árbitros que ya tienen juegos registrados no se pueden quitar.</span><div id="mp"></div><div class="rp-err" id="me"></div><button class="cta" id="msave" onclick="saveRefs()">Guardar</button><button onclick="closeM()">Cancelar</button></div>`;
document.body.appendChild(m);RefPicker.mount(m.querySelector('#mp'),MS,{locked:[...lk]})}
function closeM(){const m=document.getElementById('mr');if(m)m.remove()}
function saveRefs(){if(!RefPicker.valid(MS))return document.getElementById('me').textContent='Seleccioná al menos 2 árbitros y asigná una categoría a cada uno.';const T=Store.get();T.referees=RefPicker.clean(MS);Store.set(T);closeM();R()}
async function mg(i){const fs=[...i.files];i.value='';if(!fs.length)return;const m=document.createElement('div');m.className='modal';m.innerHTML='<div><b>Cargando evaluaciones…</b><span id="mgp" style="color:var(--mu)"></span></div>';document.body.appendChild(m);
try{const {sum,fresh}=await Store.merge(fs,(k,n)=>{const e=document.getElementById('mgp');if(e)e.textContent=k+' de '+n+' archivos'});
m.innerHTML=`<div><b>Evaluaciones cargadas</b><span>${sum.files} archivo(s) leídos · <b>${sum.newG}</b> juego(s) nuevo(s) con ${sum.plays} jugadas${sum.upd?` · ${sum.upd} actualizado(s) con una versión más reciente`:''}${sum.same?` · ${sum.same} repetido(s) que ya estaban cargados`:''}${sum.empty?` · ${sum.empty} juego(s) cerrado(s) sin jugadas (ignorados)`:''}</span>${sum.bad.length?`<span style="color:#ff9f98">No se pudieron leer ${sum.bad.length} archivo(s): ${sum.bad.slice(0,8).map(esc).join(', ')}${sum.bad.length>8?'…':''}</span>`:''}${fresh?'<span style="color:var(--mu)">Se creó un consolidado nuevo en este navegador.</span>':''}<a class="cta" style="text-align:center;text-decoration:none" href="statistics-view.html">Ver estadísticas</a><button onclick="this.closest(\'.modal\').remove()">Cerrar</button></div>`;R()}
catch(e){m.innerHTML=`<div><b>No se pudo completar la carga</b><span>${esc(e.message||'')}</span><button onclick="this.closest('.modal').remove()">Cerrar</button></div>`}}
async function ld(i){try{await Store.load(i.files[0]);R()}catch(e){alert('No se pudo cargar el archivo: '+e.message)}}R();</script></body></html>
