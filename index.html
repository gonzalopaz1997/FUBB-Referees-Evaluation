<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a39665"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>FUBB 5x5 Evaluación de Árbitros</title>
<style>.st{display:inline-block;border-radius:6px;padding:0 .5em;font-size:.85em;font-weight:700;margin-left:.4em;vertical-align:1px}.st.op{background:var(--o);color:#111}.st.cl{background:var(--c2);color:var(--o2);border:1px solid var(--b)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 label,.fl{display:flex;flex-direction:column;gap:3px;font-size:.85em;color:var(--o2)}.mode{display:flex;gap:6px;margin-bottom:10px}.mode button{flex:1}.mu{color:#9a978c;font-size:.9em}.pend{border:1px solid var(--y);background:#2a2614;border-radius:10px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}.pend b{color:var(--y)}.pend .cta{padding:10px}</style></head><body><div id="h"></div><div class="wrap" style="max-width:600px" id="app"></div><script src="panel-buttons.js"></script><script src="scoring-criteria.js"></script><script src="store.js"></script><script src="example-data.js"></script><script src="referee-pool.js"></script><script src="ref-picker.js"></script><script>
const A=document.getElementById('app');let NS=[],MS=[];
const today=()=>new Date().toLocaleDateString('en-CA');
function modeBar(){const m=Store.mode;return `<div class="mode"><button class="${m=='eval'?'on':''}" onclick="setMode('eval')">${IC.play} Mi evaluación</button><button class="${m=='cons'?'on':''}" onclick="setMode('cons')">${IC.stats} Consolidado (departamento)</button></div>`}
function setMode(m){Store.setMode(m);NS=[];R()}
function R(){const T=Store.get(),cons=Store.mode=='cons';document.getElementById('h').innerHTML=hdr('Evaluación de Árbitros',hdrInfo(T),0);
let h=modeBar();
if(!cons&&T){const G=T.games[0]||{plays:[]},open=!G.closed;
h+=`<div class="card"><b>${esc(T.name)}</b><span class="st ${open?'op':'cl'}">${open?'En curso':'Cerrado'}</span><br><span style="color:var(--o2)">${esc(gameTitle(G))} · ${esc(G.date||'')} · ${G.plays.length} jugadas${G.closed?' · Dificultad: '+esc(C_DL(G.difficulty)):''}</span><br><span>Evaluador: <b>${esc(T.evaluator||'–')}</b></span><br><span class="mu">Terna: ${(G.refs||T.referees.map(r=>r.name)).filter(Boolean).map(esc).join(' / ')}</span></div>
<a class="big" href="play-by-play.html">${IC.play}${open?'Jugada a jugada':'Ver o corregir jugadas'}</a><a class="big" href="statistics-view.html">${IC.stats}Estadísticas</a><a class="big" href="evaluation.html">${IC.eval}Evaluación</a><a class="big" href="scoring-rules.html">${IC.flag}Reglas de puntaje</a><a class="big" href="instructions.html">${IC.book}Instrucciones</a>
<div class="row"><button onclick="manage()">${IC.users} Árbitros</button><button onclick="shareEv()">${IC.ul} Compartir evaluación</button><button onclick="Store.download(Store.get())">${IC.dl} Descargar</button><button onclick="document.getElementById('f').click()">${IC.ul} Retomar (.txt)</button><button onclick="document.getElementById('x').style.display='flex'">${IC.plus} Nueva evaluación</button><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"></div>
${G.closed&&!G.sent?`<div class="pend"><b>${IC.warn} Evaluación sin enviar</b><span>Mandala por correo a <b>${esc(sendTo())}</b>.</span><div class="row"><button class="cta" onclick="shareEv()">${IC.ul} Compartir evaluación</button><button onclick="markSent()">Ya la envié</button></div></div>`:G.closed?`<p class="mu">${IC.ok} Evaluación enviada${G.sentAt?' el '+esc(new Date(G.sentAt).toLocaleDateString('es-UY')):''}. Si corregís algo, volvé a compartirla.</p>`:''}`}
else if(!cons){h+=`<div class="card"><h3>Nueva evaluación</h3><div style="display:grid;gap:8px"><label class="fl">Evaluador<input class="inp" id="ev" placeholder="Tu nombre y apellido"></label><label class="fl">Torneo<select class="inp" id="ns" onchange="document.getElementById('n').style.display=this.value=='__otro'?'block':'none'"><option value="">Elegí el torneo…</option>${TOURNAMENTS.map(t=>`<option>${esc(t)}</option>`).join('')}<option value="__otro">Otro (escribir)…</option></select><input class="inp" id="n" placeholder="Nombre del torneo" style="display:none;margin-top:6px"></label><div class="f2"><label>Local<input class="inp" id="ta" placeholder="Equipo local"></label><label>Visitante<input class="inp" id="tb" placeholder="Equipo visitante"></label></div><label class="fl">Fecha del juego<input class="inp" id="d" type="date" value="${today()}"></label></div></div>
<div class="card"><h3>Terna arbitral</h3><span class="mu">Elegí los 3 árbitros del juego (o 2 si es dupla) en orden: Principal, Auxiliar 1, Auxiliar 2.</span><div id="rp" style="margin-top:8px"></div><div class="rp-err" id="ne" style="margin-top:10px"></div><button class="cta" style="width:100%;margin-top:6px" onclick="mk()">Empezar evaluación</button></div>
<a class="big" href="scoring-rules.html">${IC.flag}Reglas de puntaje</a><div class="card"><h3>Retomar una evaluación</h3><button style="width:100%" onclick="document.getElementById('f').click()">${IC.ul} Cargar evaluación (.txt)</button><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"></div>`}
else if(T){const ev=[...new Set(T.games.map(g=>g.evaluator).filter(Boolean))].length;
h+=`<div class="card"><b>${esc(T.name)}</b>${T.example?'<span class="st cl">Ejemplo</span><br><span class="mu">Partidos y calificaciones ficticios, solo para probar la herramienta.</span>':''}<br><span style="color:var(--o2)">${T.games.length} juegos · ${allPlays(T).length} jugadas · ${ev} evaluador(es) · ${T.referees.length} árbitros</span></div>
<a class="big" href="games.html">${IC.list}Lista de juegos</a><a class="big" href="statistics-view.html">${IC.stats}Estadísticas</a><a class="big" href="evaluation.html">${IC.eval}Evaluación</a><a class="big" href="performance.html">${IC.trend}Seguimiento de desempeño <span class="st cl">Experimental</span></a><a class="big" href="scoring-rules.html">${IC.flag}Reglas de puntaje</a><a class="big" href="instructions.html">${IC.book}Instrucciones</a>
<div class="row"><button onclick="document.getElementById('fm').click()">${IC.ul} Cargar evaluaciones</button><button onclick="Store.download(Store.get())">${IC.dl} Respaldo</button><button onclick="document.getElementById('f').click()">${IC.ul} Cargar respaldo</button><button onclick="document.getElementById('x').style.display='flex'">${IC.trash} Borrar consolidado</button><input id="fm" type="file" accept=".txt,.json" multiple hidden onchange="mg(this)"><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"></div>`}
else{h+=`<div class="card"><h3>Consolidar evaluaciones</h3><span class="mu">Elegí todos los .txt que mandaron los evaluadores (se pueden seleccionar cientos a la vez) para ver estadísticas y evaluaciones conjuntas. Los juegos repetidos se cargan una sola vez.</span><button class="cta" style="width:100%;margin-top:10px" onclick="document.getElementById('fm').click()">${IC.ul} Cargar evaluaciones (.txt)</button><button style="width:100%;margin-top:8px" onclick="document.getElementById('f').click()">${IC.ul} Cargar respaldo del consolidado</button><button style="width:100%;margin-top:8px" onclick="ex()">${IC.eval} Cargar datos de ejemplo (50 partidos LUB)</button><input id="fm" type="file" accept=".txt,.json" multiple hidden onchange="mg(this)"><input id="f" type="file" accept=".txt,.json" hidden onchange="ld(this)"></div>
<a class="big" href="scoring-rules.html">${IC.flag}Reglas de puntaje</a><a class="big" href="instructions.html">${IC.book}Instrucciones</a>`}
A.innerHTML=h;
A.insertAdjacentHTML('beforeend',`<div class="modal" id="x" style="display:none"><div><b>${cons?'¿Borrar el consolidado de este navegador?':'¿Empezar una nueva evaluación?'}</b><span style="color:var(--m)">${cons?'Se borran todos los juegos cargados. Descargá un respaldo antes.':'La evaluación actual se borra de este navegador. Si todavía no la mandaste, descargala antes.'} No se puede deshacer.</span>${cons?'':`<button onclick="Store.download(Store.get())">${IC.dl} Descargar evaluación</button>`}<button class="dgr" onclick="Store.clear();NS=[];R()">${cons?'Borrar':'Borrar y empezar otra'}</button><button onclick="document.getElementById('x').style.display='none'">Cancelar</button></div></div>`);
if(!T&&!cons)RefPicker.mount(document.getElementById('rp'),NS,{onChange:()=>{const e=document.getElementById('ne');if(e)e.textContent=''}})}
function shareEv(){const T=Store.get();Store.share(T).then(r=>{if(r=='shared')markSent()})}
function markSent(){const T=Store.get(),G=T.games[0];G.sent=true;G.sentAt=new Date().toISOString();Store.set(T);R()}
function firstVisit(){let seen=true;try{seen=!!localStorage.getItem('fubb5x5_instrucciones')}catch(e){}if(seen)return;try{localStorage.setItem('fubb5x5_instrucciones','1')}catch(e){}
const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><b style="color:var(--o)">${IC.book} Bienvenido</b><span>Es la primera vez que abrís la herramienta en este dispositivo. Te recomendamos ver las instrucciones antes de evaluar tu primer partido.</span><a class="cta" style="text-align:center;text-decoration:none;padding:12px" href="instructions.html">Ver instrucciones</a><button onclick="this.closest('.modal').remove()">Ahora no</button></div>`;document.body.appendChild(m)}
const C_DL=d=>SCORING_CRITERIA.difficulty.labels[d||SCORING_CRITERIA.difficulty.default];
function mk(ok){const v=id=>document.getElementById(id).value.trim(),e=document.getElementById('ne');
if(!v('ev'))return e.textContent='Escribí el nombre del evaluador.';const tor=v('ns')=='__otro'?v('n'):v('ns');if(!tor)return e.textContent=v('ns')=='__otro'?'Escribí el nombre del torneo.':'Elegí el torneo.';
if(NS.length<2||NS.length>3)return e.textContent='Elegí 2 o 3 árbitros para la terna.';if(!RefPicker.valid(NS))return e.textContent='Asigná una categoría a cada árbitro.';
if(!ok){return mustModal()}
const t={name:tor,evaluator:v('ev'),date:v('d'),referees:RefPicker.clean(NS),games:[]};const g=Store.newGame(t);g.teamA=v('ta');g.teamB=v('tb');g.refs=[...t.referees.map(r=>r.name),'',''].slice(0,3);
Store.set(t);NS=[];location='play-by-play.html'}
/* Aviso antes de empezar: qué es obligatorio registrar */
const MUST=['Todas las revisiones IRS y Challenge','Todas las faltas descalificantes','Todas las faltas flagrantes','Todas las faltas disruptivas','Todas las faltas técnicas'];
function mustModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><b style="color:var(--y)">${IC.warn} Antes de empezar</b><span>Para que el informe sea válido y los datos sean consistentes entre todos los evaluadores, es <b>OBLIGATORIO</b> registrar:</span><ul style="margin:0;padding-left:1.2em;line-height:1.5">${MUST.map(x=>`<li><b>${x}</b></li>`).join('')}</ul><span class="mu">Para el resto de las incidencias, queda a tu criterio qué jugadas son relevantes para ingresar.</span><button class="cta" onclick="this.closest('.modal').remove();mk(true)">Entendido, empezar</button><button onclick="this.closest('.modal').remove()">Volver</button></div>`;document.body.appendChild(m)}
function manage(){const T=Store.get(),lk=new Set();T.games.forEach(g=>g.plays.forEach(p=>{lk.add(p.referee);Object.keys(p.rules||{}).forEach(n=>lk.add(n))}));MS=T.referees.map(r=>({...r}));
const m=document.createElement('div');m.className='modal';m.id='mr';m.innerHTML=`<div style="max-width:600px;max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;color:var(--o)"><b>Árbitros de la evaluación</b><button style="padding:4px;display:flex" onclick="closeM()" title="Cerrar">${IC.close}</button></div><span style="color:var(--m);font-size:.9em">Sirve para corregir la terna. Los árbitros que ya tienen jugadas no se pueden quitar.</span><div id="mp"></div><div class="rp-err" id="me"></div><button class="cta" onclick="saveRefs()">Guardar</button><button onclick="closeM()">Cancelar</button></div>`;
document.body.appendChild(m);RefPicker.mount(m.querySelector('#mp'),MS,{locked:[...lk]})}
function closeM(){const m=document.getElementById('mr');if(m)m.remove()}
function saveRefs(){if(!RefPicker.valid(MS)||MS.length>3)return document.getElementById('me').textContent='Elegí 2 o 3 árbitros y asigná una categoría a cada uno.';const T=Store.get();T.referees=RefPicker.clean(MS);const G=T.games[0];if(G){const names=T.referees.map(r=>r.name);G.refs=(G.refs||[]).map(n=>names.includes(n)?n:'');names.forEach(n=>{if(!G.refs.includes(n)){const i=G.refs.indexOf('');if(i>=0)G.refs[i]=n;else if(G.refs.length<3)G.refs.push(n)}})}Store.set(T);closeM();R()}
function ex(){Store.set(JSON.parse(JSON.stringify(EXAMPLE_DATA)));R()}
async function mg(i){const fs=[...i.files];i.value='';if(!fs.length)return;const m=document.createElement('div');m.className='modal';m.innerHTML='<div><b>Cargando evaluaciones…</b><span id="mgp" style="color:var(--m)"></span></div>';document.body.appendChild(m);
try{const T0=Store.get();if(T0&&T0.example){Store.clear()}const {sum,fresh}=await Store.merge(fs,(k,n)=>{const e=document.getElementById('mgp');if(e)e.textContent=k+' de '+n+' archivos'});
m.innerHTML=`<div><b>Evaluaciones cargadas</b><span>${sum.files} archivo(s) leídos · <b>${sum.newG}</b> juego(s) nuevo(s) con ${sum.plays} jugadas${sum.upd?` · ${sum.upd} actualizado(s) con una versión más reciente`:''}${sum.same?` · ${sum.same} repetido(s) que ya estaban cargados`:''}${sum.empty?` · ${sum.empty} juego(s) cerrado(s) sin jugadas (ignorados)`:''}</span>${sum.bad.length?`<span style="color:#e09a93">No se pudieron leer ${sum.bad.length} archivo(s): ${sum.bad.slice(0,8).map(esc).join(', ')}${sum.bad.length>8?'…':''}</span>`:''}${fresh?'<span style="color:var(--m)">Se creó un consolidado nuevo en este navegador.</span>':''}<a class="cta" style="text-align:center;text-decoration:none" href="statistics-view.html">Ver estadísticas</a><button onclick="this.closest('.modal').remove()">Cerrar</button></div>`;R()}
catch(e){m.innerHTML=`<div><b>No se pudo completar la carga</b><span>${esc(e.message||'')}</span><button onclick="this.closest('.modal').remove()">Cerrar</button></div>`}}
async function ld(i){try{const f=i.files[0];i.value='';const t=JSON.parse(await f.text());
if(Store.mode=='eval'&&(t.consolidated||t.games.length>1))return alert('Ese archivo tiene varios juegos. Para verlo, pasá a Consolidado y usá Cargar evaluaciones.');
if(Store.mode=='cons'&&!t.consolidated)return alert('Ese archivo es la evaluación de un juego. Para sumarlo al consolidado usá Cargar evaluaciones.');
await Store.load(f);R()}catch(e){alert('No se pudo cargar el archivo: '+e.message)}}
R();firstVisit();</script></body></html>
